<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lihat Absensi - Star Tools</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #F1F5F9;
    color: #0F172A;
  }
  body.dark { background:#0B1120; color:#F1F5F9; }

  .app-container {
    max-width: 1000px;
    margin: 0 auto;
    background: #F1F5F9;
    min-height: 100vh;
    padding: 0 12px;
  }
  body.dark .app-container { background:#0B1120; }

  /* ===== HEADER ===== */
  .header-brand {
    background: linear-gradient(145deg, #1D4ED8, #2563EB, #3B82F6);
    padding: 28px 20px 32px;
    color: #fff;
    text-align: center;
    border-radius: 0 0 18px 18px;
    margin-bottom: 14px;
  }

  .logo-mini {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 14px;
    background: rgba(255,255,255,0.15);
    padding: 5px 16px;
    border-radius: 30px;
    margin-bottom: 12px;
  }
  .logo-mini svg { width: 16px; height: 16px; }

  .header-brand h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
    word-break: break-word;
  }
  .header-brand .sub-info {
    font-size: 16px;
    opacity: 0.9;
  }
  .header-brand .sub-info span {
    background: rgba(255,255,255,0.12);
    padding: 2px 14px;
    border-radius: 20px;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    padding: 5px 16px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    margin-top: 12px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ADE80;
    animation: pulseDot 1.5s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 12px 6px;
    border: 2px solid #E2E8F0;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  body.dark .stat-card {
    background: #111827;
    border-color: #1E293B;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .stat-card .num {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.2;
  }
  .stat-card .label {
    font-size: 13px;
    color: #64748B;
    margin-top: 2px;
    font-weight: 600;
  }
  body.dark .stat-card .label { color: #94A3B8; }
  .stat-card .num.hadir { color: #059669; }
  .stat-card .num.izin { color: #D97706; }
  .stat-card .num.sakit { color: #B45309; }
  .stat-card .num.alpa { color: #DC2626; }
  .stat-card .num.belum { color: #94A3B8; }
  body.dark .stat-card .num.hadir { color: #34D399; }
  body.dark .stat-card .num.izin { color: #FBBF24; }
  body.dark .stat-card .num.sakit { color: #F59E0B; }
  body.dark .stat-card .num.alpa { color: #F87171; }
  body.dark .stat-card .num.belum { color: #64748B; }

  /* ===== FILTER ===== */
  .filter-container {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 14px 16px;
    border: 2px solid #E2E8F0;
    margin-bottom: 14px;
  }
  body.dark .filter-container {
    background: #111827;
    border-color: #1E293B;
  }

  .filter-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-row label {
    font-size: 16px;
    font-weight: 700;
    color: #0F172A;
  }
  body.dark .filter-row label { color: #F1F5F9; }

  .select-box {
    flex: 1;
    min-width: 140px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid #E2E8F0;
    background: #F8FAFE;
    font-size: 16px;
    color: #0F172A;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
  }
  body.dark .select-box {
    background: #1E293B;
    border-color: #334155;
    color: #F1F5F9;
  }

  .search-input {
    flex: 1.5;
    min-width: 130px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid #E2E8F0;
    background: #F8FAFE;
    font-size: 16px;
    color: #0F172A;
    font-family: inherit;
    outline: none;
    transition: 0.2s;
  }
  body.dark .search-input {
    background: #1E293B;
    border-color: #334155;
    color: #F1F5F9;
  }
  .search-input::placeholder { color: #94A3B8; font-size: 15px; }
  body.dark .search-input::placeholder { color: #64748B; }
  .search-input:focus { border-color: #2563EB; }

  /* ===== LEGENDA ===== */
  .legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 2px solid #E2E8F0;
  }
  body.dark .legend-row { border-top-color: #1E293B; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #0F172A;
  }
  body.dark .legend-item { color: #F1F5F9; }
  .legend-dot {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .legend-dot.hadir { background: #059669; }
  .legend-dot.izin { background: #D97706; }
  .legend-dot.sakit { background: #B45309; }
  .legend-dot.alpa { background: #DC2626; }
  .legend-dot.belum { background: #CBD5E1; }
  body.dark .legend-dot.belum { background: #334155; }

  /* ===== TABLE BESAR ===== */
  .table-wrap {
    border-radius: 14px;
    border: 2px solid #E2E8F0;
    overflow: auto;
    background: #FFFFFF;
    max-height: 68vh;
    position: relative;
  }
  body.dark .table-wrap {
    background: #111827;
    border-color: #1E293B;
  }

  .table-wrap::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .table-wrap::-webkit-scrollbar-track {
    background: #F1F5F9;
    border-radius: 6px;
  }
  body.dark .table-wrap::-webkit-scrollbar-track { background: #1E293B; }
  .table-wrap::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 6px;
  }
  body.dark .table-wrap::-webkit-scrollbar-thumb { background: #334155; }

  table.grid-table {
    border-collapse: collapse;
    font-size: 18px;
    min-width: 100%;
    width: 100%;
  }
  .grid-table th, .grid-table td {
    border-right: 2px solid #E2E8F0;
    border-bottom: 2px solid #E2E8F0;
    padding: 0;
    text-align: center;
    vertical-align: middle;
  }
  body.dark .grid-table th, body.dark .grid-table td {
    border-color: #1E293B;
  }

  .grid-table thead th {
    background: #F8FAFE;
    color: #1E293B;
    font-weight: 800;
    padding: 14px 6px;
    position: sticky;
    top: 0;
    z-index: 5;
    font-size: 15px;
    border-bottom: 3px solid #E2E8F0;
    min-height: 50px;
  }
  body.dark .grid-table thead th {
    background: #1E293B;
    color: #E2E8F0;
    border-bottom-color: #334155;
  }

  .col-nama {
    width: 180px;
    min-width: 180px;
    max-width: 180px;
    text-align: left !important;
  }
  .col-tgl {
    width: 44px;
    min-width: 44px;
    max-width: 44px;
  }
  .col-tgl-weekend {
    background: #F8FAFE;
    color: #64748B;
  }
  body.dark .col-tgl-weekend { background: #1A1F2E; color: #94A3B8; }

  .sticky-col {
    position: sticky;
    left: 0;
    background: #FFFFFF;
    z-index: 3;
  }
  body.dark .sticky-col { background: #111827; }
  thead .sticky-col { z-index: 6; }

  .cell-nama {
    padding: 14px 12px;
    font-weight: 700;
    font-size: 17px;
    border-right: 3px solid #E2E8F0 !important;
    min-height: 52px;
  }
  body.dark .cell-nama { border-right-color: #334155 !important; }

  .cell-status {
    padding: 14px 2px;
    font-weight: 800;
    font-size: 20px;
    min-width: 44px;
    min-height: 52px;
    color: #CBD5E1;
  }
  body.dark .cell-status { color: #334155; }
  .cell-status.hadir {
    color: #059669;
    background: #ECFDF5;
  }
  .cell-status.izin {
    color: #D97706;
    background: #FFFBEB;
  }
  .cell-status.sakit {
    color: #B45309;
    background: #FFFBEB;
  }
  .cell-status.alpa {
    color: #DC2626;
    background: #FEF2F2;
  }
  body.dark .cell-status.hadir {
    background: #0A2A1A;
    color: #34D399;
  }
  body.dark .cell-status.izin {
    background: #2A1F0A;
    color: #FBBF24;
  }
  body.dark .cell-status.sakit {
    background: #2A1F0A;
    color: #F59E0B;
  }
  body.dark .cell-status.alpa {
    background: #2A0F0F;
    color: #F87171;
  }
  .cell-status.belum {
    color: #CBD5E1;
  }
  body.dark .cell-status.belum { color: #334155; }

  /* ===== BUTTON ===== */
  .btn-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .btn {
    padding: 14px 24px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
    flex: 1;
    min-width: 120px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: #2563EB;
    color: #fff;
  }
  .btn-primary:hover { background: #1D4ED8; }
  .btn-outline {
    background: transparent;
    border: 2px solid #E2E8F0;
    color: #0F172A;
  }
  body.dark .btn-outline {
    border-color: #334155;
    color: #F1F5F9;
  }
  .btn-outline:hover { background: #F1F5F9; }
  body.dark .btn-outline:hover { background: #1E293B; }

  .export-container {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 14px 16px;
    border: 2px solid #E2E8F0;
    margin-top: 14px;
  }
  body.dark .export-container {
    background: #111827;
    border-color: #1E293B;
  }

  /* ===== STATES ===== */
  .empty-state, .error-state {
    text-align: center;
    padding: 40px 20px;
    color: #94A3B8;
    font-size: 17px;
  }
  body.dark .empty-state, body.dark .error-state { color: #64748B; }
  .error-state svg {
    width: 50px;
    height: 50px;
    stroke: #DC2626;
    margin-bottom: 12px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .empty-state svg {
    width: 50px;
    height: 50px;
    stroke: #94A3B8;
    margin-bottom: 12px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  .loading-spin {
    width: 40px;
    height: 40px;
    border: 4px solid #E2E8F0;
    border-top-color: #2563EB;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 40px auto;
  }
  body.dark .loading-spin { border-color: #1E293B; border-top-color: #2563EB; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== FOOTER ===== */
  .footer-note {
    text-align: center;
    padding: 18px 16px;
    color: #94A3B8;
    font-size: 13px;
    line-height: 1.8;
  }
  body.dark .footer-note { color: #64748B; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 700px) {
    .stats-bar {
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .stat-card { padding: 10px 4px; border-radius: 10px; }
    .stat-card .num { font-size: 22px; }
    .stat-card .label { font-size: 11px; }

    .header-brand { padding: 20px 16px 26px; }
    .header-brand h1 { font-size: 22px; }
    .header-brand .sub-info { font-size: 14px; }
    .live-badge { font-size: 12px; padding: 4px 12px; }
    .logo-mini { font-size: 12px; padding: 4px 12px; }

    .filter-row { flex-direction: column; gap: 8px; }
    .filter-row label { font-size: 14px; align-self: flex-start; }
    .select-box, .search-input {
      font-size: 15px;
      padding: 10px 12px;
      width: 100%;
      min-width: auto;
    }
    .search-input::placeholder { font-size: 13px; }

    .filter-container { padding: 12px; border-radius: 12px; }
    .export-container { padding: 12px; border-radius: 12px; }

    .col-nama { width: 120px; min-width: 120px; max-width: 120px; }
    .col-tgl { width: 34px; min-width: 34px; max-width: 34px; }
    .cell-nama { font-size: 14px; padding: 10px 8px; min-height: 42px; }
    .cell-status { font-size: 16px; padding: 10px 2px; min-width: 34px; min-height: 42px; }
    .grid-table thead th { font-size: 12px; padding: 10px 4px; min-height: 40px; }
    table.grid-table { font-size: 14px; }

    .legend-row { gap: 8px; }
    .legend-item { font-size: 13px; }
    .legend-dot { width: 14px; height: 14px; }

    .btn-group { flex-direction: column; }
    .btn { font-size: 14px; padding: 12px 16px; min-height: 46px; }

    .footer-note { font-size: 12px; padding: 14px; }
  }

  @media (max-width: 500px) {
    .stats-bar {
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .stat-card .num { font-size: 18px; }
    .stat-card .label { font-size: 10px; }
    .stat-card { padding: 8px 4px; }
    .col-nama { width: 100px; min-width: 100px; max-width: 100px; }
    .col-tgl { width: 30px; min-width: 30px; max-width: 30px; }
    .cell-nama { font-size: 12px; padding: 8px 6px; min-height: 36px; }
    .cell-status { font-size: 14px; padding: 8px 1px; min-width: 30px; min-height: 36px; }
    .grid-table thead th { font-size: 10px; padding: 8px 2px; min-height: 34px; }
    table.grid-table { font-size: 12px; }
    .header-brand h1 { font-size: 19px; }
  }

  @media (min-width: 900px) {
    body {
      background: linear-gradient(160deg, #EFF6FF 0%, #F8FAFE 60%);
      min-height: 100vh;
    }
    body.dark {
      background: linear-gradient(160deg, #0B1120 0%, #111827 60%);
    }
    .app-container {
      max-width: 1060px;
      margin: 24px auto;
      min-height: auto;
      background: #F1F5F9;
      border-radius: 20px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      padding: 0 20px 16px;
    }
    body.dark .app-container {
      background: #0B1120;
      border-color: #1E293B;
      box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header-brand { border-radius: 0 0 18px 18px; margin: -1px -20px 16px; }
    .col-nama { width: 200px; min-width: 200px; max-width: 200px; }
    .col-tgl { width: 48px; min-width: 48px; max-width: 48px; }
    .cell-nama { font-size: 18px; padding: 16px 14px; }
    .cell-status { font-size: 22px; padding: 16px 4px; min-width: 48px; }
    table.grid-table { font-size: 18px; }
    .grid-table thead th { font-size: 16px; padding: 16px 8px; }
  }
</style>
</head>

<div class="app-container">
  <!-- HEADER -->
  <div class="header-brand">
    <div class="logo-mini">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Star Tools
    </div>
    <h1 id="namaKelasHeader">Memuat...</h1>
    <div class="sub-info">
      <span id="jumlahMuridHeader">- murid</span>
    </div>
    <div class="live-badge">
      <span class="live-dot"></span> Live Update · <span id="lastUpdateText">Real-time</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <div class="num hadir" id="statHadir">0</div>
      <div class="label">Hadir</div>
    </div>
    <div class="stat-card">
      <div class="num izin" id="statIzin">0</div>
      <div class="label">Izin</div>
    </div>
    <div class="stat-card">
      <div class="num sakit" id="statSakit">0</div>
      <div class="label">Sakit</div>
    </div>
    <div class="stat-card">
      <div class="num alpa" id="statAlpa">0</div>
      <div class="label">Alpa</div>
    </div>
    <div class="stat-card">
      <div class="num belum" id="statBelum">0</div>
      <div class="label">Belum</div>

  <!-- FILTER -->
  <div class="filter-container">
    <div class="filter-row">
      <label for="pilihBulanView">Bulan</label>
      <select class="select-box" id="pilihBulanView" onchange="gantiBulan(this.value)"></select>
      <input class="search-input" id="searchInput" placeholder="Cari nama murid..." oninput="filterMurid(this.value)">
    </div>
    <div class="legend-row">
      <span class="legend-item"><span class="legend-dot hadir"></span> Hadir (H)</span>
      <span class="legend-item"><span class="legend-dot izin"></span> Izin (I)</span>
      <span class="legend-item"><span class="legend-dot sakit"></span> Sakit (S)</span>
      <span class="legend-item"><span class="legend-dot alpa"></span> Alpa (A)</span>
      <span class="legend-item"><span class="legend-dot belum"></span> Belum (-)</span>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table class="grid-table" id="tabelGrid">
      <thead>
        <tr>
          <th class="sticky-col col-nama">Nama</th>
          <tbody id="tabelGridBody"></tbody>
        </tr>
      </thead>
    </table>
  </div>

  <!-- EXPORT -->
  <div class="export-container">
    <div class="btn-group">
      <button class="btn btn-primary" onclick="exportGridPDF()">Export PDF</button>
      <button class="btn btn-outline" onclick="exportGridCSV()">Export CSV</button>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer-note">
    Halaman ini untuk melihat data absensi. Data otomatis terupdate secara real-time.<br>
    Star Platform &middot; Star Tools 2026
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2",
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
var db = firebase.database();

function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

var kelasId = getParam("kelas");
var namaKelasAktif = "";
var BULAN_LIST = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var bulanDipilih = new Date().toLocaleString("id-ID", { month: "long" });
var daftarMuridAktif = [];
var absenListeners = {};
var searchQuery = "";

function daysInMonth(namaBulan) {
  var idx = BULAN_LIST.indexOf(namaBulan);
  var now = new Date();
  return new Date(now.getFullYear(), idx + 1, 0).getDate();
}

function isWeekend(tgl) {
  var idx = BULAN_LIST.indexOf(bulanDipilih);
  var year = new Date().getFullYear();
  var d = new Date(year, idx, tgl);
  var day = d.getDay();
  return day === 0 || day === 6;
}

function renderError(msg) {
  document.getElementById("namaKelasHeader").innerText = "Tidak Ditemukan";
  document.getElementById("jumlahMuridHeader").innerText = "- murid";
  document.getElementById("statsBar").style.display = "none";
  document.getElementById("tabelGridBody").innerHTML =
    '<tr><td colspan="2" class="error-state">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
    '<div style="font-weight:700;color:#0F172A;margin-bottom:4px;font-size:20px;">' + msg + '</div>' +
    '<div style="font-size:16px;">Pastikan link yang dibuka lengkap dan benar.</div></td></tr>';
}

function renderBulanOptions() {
  var select = document.getElementById("pilihBulanView");
  select.innerHTML = '';
  BULAN_LIST.forEach(function(b) {
    var opt = document.createElement('option');
    opt.value = b;
    opt.textContent = b;
    if (b === bulanDipilih) opt.selected = true;
    select.appendChild(opt);
  });
}

function renderHeaderTable() {
  var totalHari = daysInMonth(bulanDipilih);
  var thead = document.querySelector('#tabelGrid thead tr');
  if (!thead) return;
  
  var html = '<th class="sticky-col col-nama">Nama</th>';
  for (var i = 1; i <= totalHari; i++) {
    var cls = isWeekend(i) ? 'col-tgl col-tgl-weekend' : 'col-tgl';
    html += '<th class="' + cls + '">' + i + '</th>';
  }
  thead.innerHTML = html;
}

function filterMurid(query) {
  searchQuery = query.toLowerCase().trim();
  renderBaris(daysInMonth(bulanDipilih));
  updateStats();
}

function getFilteredMurid() {
  if (!searchQuery) return daftarMuridAktif;
  return daftarMuridAktif.filter(function(nama) {
    return nama.toLowerCase().includes(searchQuery);
  });
}

function renderBaris(totalHari) {
  var tbody = document.getElementById("tabelGridBody");
  if (!tbody) return;

  var filtered = getFilteredMurid();

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + (totalHari + 1) + '" class="empty-state">' +
      (daftarMuridAktif.length === 0 ? 'Belum ada murid di kelas ini.' : 'Tidak ada murid yang cocok dengan pencarian.') +
      '</td></tr>';
    return;
  }

  var html = "";
  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    html += '<tr><td class="sticky-col cell-nama">' + nama + '</td>';
    for (var i = 1; i <= totalHari; i++) {
      var cls = isWeekend(i) ? 'cell-status belum' : 'cell-status';
      html += '<td class="' + cls + '" id="cell-' + safe + '-' + i + '">-</td>';
    }
    html += '</tr>';
  });
  tbody.innerHTML = html;

  // Pasang ulang listener
  Object.keys(absenListeners).forEach(function(nama) {
    if (absenListeners[nama]) absenListeners[nama].off();
  });
  absenListeners = {};

  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    var ref = db.ref("kelas/" + kelasId + "/siswa/" + nama + "/absen/" + bulanDipilih);
    absenListeners[nama] = ref;

    ref.on("value", function(snap) {
      var data = snap.val() || {};
      var total = daysInMonth(bulanDipilih);
      for (var i = 1; i <= total; i++) {
        var el = document.getElementById("cell-" + safe + "-" + i);
        if (!el) continue;
        var rec = data[i];
        var status = rec ? rec.status : null;

        el.className = isWeekend(i) ? 'cell-status' : 'cell-status';
        if (status === "Hadir") { el.classList.add("hadir"); el.innerText = "H"; }
        else if (status === "Izin") { el.classList.add("izin"); el.innerText = "I"; }
        else if (status === "Sakit") { el.classList.add("sakit"); el.innerText = "S"; }
        else if (status === "Alpa") { el.classList.add("alpa"); el.innerText = "A"; }
        else { el.classList.add("belum"); el.innerText = "-"; }
        if (isWeekend(i)) el.classList.add("belum");
      }
      updateStats();
    });
  });

  updateStats();
}

function updateStats() {
  var filtered = getFilteredMurid();
  var totalHari = daysInMonth(bulanDipilih);
  var stats = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0, Belum: 0 };

  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    for (var i = 1; i <= totalHari; i++) {
      var el = document.getElementById("cell-" + safe + "-" + i);
      if (!el) continue;
      var status = el.innerText;
      if (status === "H") stats.Hadir++;
      else if (status === "I") stats.Izin++;
      else if (status === "S") stats.Sakit++;
      else if (status === "A") stats.Alpa++;
      else stats.Belum++;
    }
  });

  document.getElementById("statHadir").innerText = stats.Hadir;
  document.getElementById("statIzin").innerText = stats.Izin;
  document.getElementById("statSakit").innerText = stats.Sakit;
  document.getElementById("statAlpa").innerText = stats.Alpa;
  document.getElementById("statBelum").innerText = stats.Belum;
  document.getElementById("statsBar").style.display = "grid";

  var now = new Date();
  var jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  document.getElementById("lastUpdateText").innerText = jam;
}

function gantiBulan(bulan) {
  bulanDipilih = bulan;
  var totalHari = daysInMonth(bulanDipilih);
  renderHeaderTable();
  renderBaris(totalHari);
}

function exportGridPDF() {
  var jsPDFLib = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDFLib) {
    alert("Library PDF belum siap, coba lagi sebentar.");
    return;
  }

  var totalHari = daysInMonth(bulanDipilih);
  var filtered = getFilteredMurid();
  var head = [["Nama"].concat(Array.from({ length: totalHari }, function(_, i) { return String(i + 1); }))];
  var body = filtered.map(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    var row = [nama];
    for (var i = 1; i <= totalHari; i++) {
      var el = document.getElementById("cell-" + safe + "-" + i);
      row.push(el ? el.innerText : "-");
    }
    return row;
  });

  var doc = new jsPDFLib({ orientation: "landscape", unit: "mm", format: "a4" });
  doc.setFontSize(16);
  doc.setTextColor(37, 99, 235);
  doc.text("Absensi Kelas " + namaKelasAktif + " — " + bulanDipilih, 14, 18);

  doc.setFontSize(10);
  doc.setTextColor(100, 116, 139);
  doc.text("Diexport: " + new Date().toLocaleString("id-ID"), 14, 25);

  doc.autoTable({
    startY: 32,
    head: head,
    body: body,
    styles: { fontSize: 8, halign: "center", cellPadding: 2 },
    columnStyles: { 0: { halign: "left", fontStyle: "bold", cellWidth: 30 } },
    headStyles: { fillColor: [37, 99, 235], fontSize: 8 },
    tableWidth: "auto"
  });

  doc.save("Absensi-" + namaKelasAktif.replace(/\s+/g, "_") + "-" + bulanDipilih + ".pdf");
}

function exportGridCSV() {
  var totalHari = daysInMonth(bulanDipilih);
  var filtered = getFilteredMurid();

  var csv = "\uFEFF";
  csv += "Absensi Kelas " + namaKelasAktif + " — " + bulanDipilih + "\n";
  csv += "Diexport: " + new Date().toLocaleString("id-ID") + "\n\n";

  var header = "Nama";
  for (var i = 1; i <= totalHari; i++) header += "," + i;
  csv += header + "\n";

  filtered.forEach(function(nama) {
    var safe = nama.replace(/[^a-zA-Z0-9]/g, "_");
    var row = '"' + nama + '"';
    for (var i = 1; i <= totalHari; i++) {
      var el = document.getElementById("cell-" + safe + "-" + i);
      var val = el ? el.innerText : "-";
      row += "," + val;
    }
    csv += row + "\n";
  });

  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Absensi-" + namaKelasAktif.replace(/\s+/g, "_") + "-" + bulanDipilih + ".csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

window.addEventListener("DOMContentLoaded", function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
  }

  if (!kelasId) {
    renderError("Link tidak valid.");
    return;
  }

  db.ref("kelas/" + kelasId).once("value").then(function(snap) {
    if (!snap.exists()) {
      renderError("Kelas tidak ditemukan.");
      return;
    }
    var kelasData = snap.val();
    namaKelasAktif = kelasData.nama || "Kelas";
    daftarMuridAktif = kelasData.siswa ? Object.keys(kelasData.siswa) : [];

    document.getElementById("namaKelasHeader").innerText = namaKelasAktif;
    document.getElementById("jumlahMuridHeader").innerHTML = daftarMuridAktif.length + " murid";

    renderBulanOptions();
    renderHeaderTable();
    renderBaris(daysInMonth(bulanDipilih));
    document.getElementById("statsBar").style.display = "grid";
  }).catch(function(err) {
    renderError("Gagal memuat data. Periksa koneksi internet.");
  });
});
</script>
