<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lihat Absensi - Star Tools</title>

<link rel="icon" type="image/png" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #F1F5F9;
    color: #0F172A;
  }
  body.dark { background:#0B1120; color:#F1F5F9; }

  body.dark .app-container { background: #0B1120; }
  body.dark .header-card { background: #111827; border-color: #1E293B; }
  body.dark .filter-card { background: #111827; border-color: #1E293B; }
  body.dark .table-wrap { background: #111827; border-color: #1E293B; }
  body.dark .export-card { background: #111827; border-color: #1E293B; }

  body.dark .stat-item .num.hadir { color: #34D399; }
  body.dark .stat-item .num.izin { color: #FBBF24; }
  body.dark .stat-item .num.sakit { color: #F59E0B; }
  body.dark .stat-item .num.alpa { color: #F87171; }
  body.dark .stat-item .num.total { color: #60A5FA; }
  body.dark .stat-item .label { color: #94A3B8; }

  body.dark .select-box {
    background: #1E293B;
    border-color: #334155;
    color: #F1F5F9;
  }
  body.dark .search-input {
    background: #1E293B;
    border-color: #334155;
    color: #F1F5F9;
  }
  body.dark .search-input::placeholder { color: #64748B; }

  body.dark .grid-table th, body.dark .grid-table td {
    border-color: #1E293B;
  }
  body.dark .grid-table thead th {
    background: #1E293B;
    color: #E2E8F0;
  }
  body.dark .sticky-col { background: #111827; }
  body.dark .cell-nama {
    background: #111827;
    border-right-color: #1E293B !important;
  }

  body.dark .cell-status.hadir {
    color: #6EE7B7;
    background: #064E3B;
  }
  body.dark .cell-status.izin {
    color: #FCD34D;
    background: #78350F;
  }
  body.dark .cell-status.sakit {
    color: #FBBF24;
    background: #78350F;
  }
  body.dark .cell-status.alpa {
    color: #FCA5A5;
    background: #7F1D1D;
  }
  body.dark .cell-status.belum {
    color: #64748B;
    background: #1E293B;
  }

  body.dark .btn-outline {
    border-color: #334155;
    color: #F1F5F9;
  }
  body.dark .btn-outline:hover { background: #1E293B; }

  body.dark .footer-note { color: #64748B; }
  body.dark .empty-state { color: #64748B; }
  body.dark .loading-spin { border-color: #1E293B; border-top-color: #2563EB; }

  .app-container {
    max-width: 720px;
    margin: 0 auto;
    background: #F1F5F9;
    min-height: 100vh;
    padding: 12px;
  }

  /* HEADER */
  .header-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 20px 18px;
    border: 1px solid #E2E8F0;
    margin-bottom: 12px;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-top h1 {
    font-size: 20px;
    font-weight: 800;
    color: #0F172A;
  }
  .header-top .badge {
    font-size: 12px;
    background: #2563EB;
    color: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    font-weight: 700;
  }
  .header-sub {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 13px;
    color: #64748B;
    flex-wrap: wrap;
  }
  .header-sub .live {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #059669;
    font-weight: 700;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22C55E;
    animation: pulseDot 1.5s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* STATS RINGKAS */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .stat-item {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    border: 1px solid #E2E8F0;
  }
  .stat-item .num {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.2;
  }
  .stat-item .num.hadir { color: #059669; }
  .stat-item .num.izin { color: #D97706; }
  .stat-item .num.sakit { color: #B45309; }
  .stat-item .num.alpa { color: #DC2626; }
  .stat-item .num.total { color: #2563EB; }
  .stat-item .label {
    font-size: 11px;
    color: #64748B;
    font-weight: 600;
  }

  /* FILTER */
  .filter-card {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid #E2E8F0;
    margin-bottom: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-card label {
    font-weight: 700;
    font-size: 14px;
    color: #0F172A;
  }
  .select-box {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #E2E8F0;
    background: #F8FAFE;
    font-size: 14px;
    color: #0F172A;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    flex: 1;
    min-width: 120px;
  }
  .search-input {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #E2E8F0;
    background: #F8FAFE;
    font-size: 14px;
    color: #0F172A;
    font-family: inherit;
    outline: none;
    flex: 1.5;
    min-width: 120px;
  }
  .search-input:focus { border-color: #2563EB; }
  .search-input::placeholder { color: #94A3B8; }

  /* TABLE */
  .table-wrap {
    background: #FFFFFF;
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    overflow: auto;
    max-height: 65vh;
    position: relative;
  }
  .table-wrap::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .table-wrap::-webkit-scrollbar-track {
    background: #F1F5F9;
    border-radius: 4px;
  }
  .table-wrap::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 4px;
  }

  table.grid-table {
    border-collapse: collapse;
    font-size: 16px;
    width: 100%;
    min-width: 100%;
  }
  .grid-table th, .grid-table td {
    border-right: 1px solid #E2E8F0;
    border-bottom: 1px solid #E2E8F0;
    padding: 0;
    text-align: center;
    vertical-align: middle;
  }
  .grid-table thead th {
    background: #F8FAFE;
    color: #1E293B;
    font-weight: 700;
    padding: 12px 6px;
    position: sticky;
    top: 0;
    z-index: 10;
    font-size: 13px;
    min-height: 44px;
  }
  .col-nama {
    width: 140px;
    min-width: 140px;
    max-width: 140px;
    text-align: left !important;
  }
  .col-tgl {
    width: 36px;
    min-width: 36px;
    max-width: 36px;
  }

  /* FIX: Sticky column ga nembus */
  .sticky-col {
    position: sticky;
    left: 0;
    background: #FFFFFF;
    z-index: 5;
  }
  thead .sticky-col { z-index: 11; }

  .cell-nama {
    padding: 12px 10px;
    font-weight: 600;
    font-size: 14px;
    border-right: 2px solid #E2E8F0 !important;
    background: #FFFFFF;
    min-height: 44px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-status {
    padding: 12px 2px;
    font-weight: 700;
    font-size: 16px;
    min-height: 44px;
    min-width: 36px;
    color: #94A3B8;
  }
  .cell-status.hadir {
    color: #065F46;
    background: #D1FAE5;
  }
  .cell-status.izin {
    color: #92400E;
    background: #FEF3C7;
  }
  .cell-status.sakit {
    color: #92400E;
    background: #FDE68A;
  }
  .cell-status.alpa {
    color: #991B1B;
    background: #FECACA;
  }
  .cell-status.belum {
    color: #94A3B8;
    background: #F1F5F9;
  }
  .cell-status.weekend {
    color: #94A3B8;
    background: #F8FAFE;
  }

  /* EXPORT */
  .export-card {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid #E2E8F0;
    margin-top: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
    flex: 1;
    min-width: 100px;
    min-height: 44px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: #2563EB;
    color: #fff;
  }
  .btn-primary:hover { background: #1D4ED8; }
  .btn-outline {
    background: transparent;
    border: 1px solid #E2E8F0;
    color: #0F172A;
  }
  .btn-outline:hover { background: #F1F5F9; }

  .footer-note {
    text-align: center;
    padding: 16px;
    color: #94A3B8;
    font-size: 12px;
    line-height: 1.6;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #94A3B8;
    font-size: 15px;
  }
  .loading-spin {
    width: 32px;
    height: 32px;
    border: 3px solid #E2E8F0;
    border-top-color: #2563EB;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 40px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: #FFFFFF;
    width: 320px;
    max-width: 90%;
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    animation: modalPop 0.25s ease;
  }
  @keyframes modalPop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-content h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .modal-content p { font-size: 14px; color: #64748B; margin-bottom: 16px; line-height: 1.5; }
  .modal-content .btn-modal {
    background: #2563EB;
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    min-width: 100px;
  }
  body.dark .modal-content {
    background: #111827;
    border: 1px solid #1E293B;
  }
  body.dark .modal-content p { color: #94A3B8; }
  body.dark .modal-content h3 { color: #F1F5F9; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .stats-row {
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .stat-item .num { font-size: 18px; }
    .stat-item .label { font-size: 10px; }
    .stat-item { padding: 8px 4px; }

    .header-top h1 { font-size: 17px; }
    .header-sub { font-size: 12px; gap: 10px; }

    .filter-card { flex-direction: column; gap: 6px; }
    .filter-card label { align-self: flex-start; }
    .select-box, .search-input { width: 100%; min-width: auto; }

    .col-nama { width: 100px; min-width: 100px; max-width: 100px; }
    .col-tgl { width: 30px; min-width: 30px; max-width: 30px; }
    .cell-nama { font-size: 12px; padding: 10px 6px; min-height: 38px; }
    .cell-status { font-size: 13px; padding: 10px 2px; min-height: 38px; min-width: 30px; }
    .grid-table thead th { font-size: 11px; padding: 10px 4px; min-height: 38px; }

    .export-card { flex-direction: column; }
    .btn { min-height: 40px; font-size: 13px; }

    .app-container { padding: 8px; }
  }

  @media (min-width: 900px) {
    body {
      background: linear-gradient(160deg, #EFF6FF 0%, #F8FAFE 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.dark {
      background: linear-gradient(160deg, #0B1120 0%, #111827 60%);
    }
    .app-container {
      max-width: 760px;
      margin: 30px auto;
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 20px 50px -12px rgba(15,23,42,0.12);
      overflow: hidden;
      min-height: auto;
      padding: 20px;
    }
    body.dark .app-container {
      background: #111827;
      border-color: #1E293B;
      box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    }
    .header-card { border: none; padding: 0 0 16px 0; border-radius: 0; }
    .filter-card { border-radius: 14px; }
    .table-wrap { border-radius: 14px; }
    .export-card { border-radius: 14px; }
    .stats-row { gap: 10px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- HEADER -->
  <div class="header-card">
    <div class="header-top">
      <h1 id="namaKelas">Memuat...</h1>
      <span class="badge" id="jmlMurid">0 murid</span>
    </div>
    <div class="header-sub">
      <span id="tanggalDisplay">-</span>
      <span class="live">
        <span class="live-dot"></span>
        <span id="lastUpdate">Real-time</span>
      </span>
      <span id="hariKe">Hari ke-</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row" id="statsRow">
    <div class="stat-item">
      <div class="num hadir" id="statHadir">0</div>
      <div class="label">Hadir</div>
    </div>
    <div class="stat-item">
      <div class="num izin" id="statIzin">0</div>
      <div class="label">Izin</div>
    </div>
    <div class="stat-item">
      <div class="num sakit" id="statSakit">0</div>
      <div class="label">Sakit</div>
    </div>
    <div class="stat-item">
      <div class="num alpa" id="statAlpa">0</div>
      <div class="label">Alpa</div>
    </div>
    <div class="stat-item">
      <div class="num total" id="statTotal">0</div>
      <div class="label">Total</div>
    </div>
  </div>

  <!-- FILTER -->
  <div class="filter-card">
    <label for="pilihTanggal">Tanggal</label>
    <input type="date" class="select-box" id="pilihTanggal" onchange="gantiTanggal(this.value)">
    <input class="search-input" id="searchInput" placeholder="Cari nama..." oninput="filterMurid(this.value)">
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table class="grid-table" id="tabelGrid">
      <thead>
        <tr>
          <th class="sticky-col col-nama">Nama</th>
          <th class="col-tgl">Status</th>
        </tr>
      </thead>
      <tbody id="tabelGridBody"></tbody>
    </table>
  </div>

  <!-- EXPORT -->
  <div class="export-card">
    <button class="btn btn-primary" onclick="exportPDF()">Export PDF</button>
    <button class="btn btn-outline" onclick="exportCSV()">Export Excel</button>
  </div>

  <div class="footer-note">
    Star Platform &middot; Star Tools 2026
  </div>
</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalTitle">Perhatian</h3>
    <p id="modalMessage">Pesan</p>
    <button class="btn-modal" onclick="closeModal()">Mengerti</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2",
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== UTILITY =====
function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

function showAlert(title, msg) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalMessage').innerText = msg;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ===== STATE =====
const kelasId = getParam('kelas');
let namaKelas = '';
let daftarMurid = [];
let tanggalDipilih = new Date().toISOString().split('T')[0];
let searchQuery = '';
let listenerRef = null;

// ===== RENDER =====
function formatTanggal(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function getHariKe(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  return Math.ceil((d - start) / 86400000) + 1;
}

function renderHeader() {
  document.getElementById('namaKelas').innerText = namaKelas || 'Kelas';
  document.getElementById('jmlMurid').innerText = daftarMurid.length + ' murid';
  document.getElementById('tanggalDisplay').innerText = formatTanggal(tanggalDipilih);
  document.getElementById('hariKe').innerText = 'Hari ke-' + getHariKe(tanggalDipilih);
}

function filterMurid(query) {
  searchQuery = query.toLowerCase().trim();
  renderTable();
}

function getFilteredMurid() {
  if (!searchQuery) return daftarMurid;
  return daftarMurid.filter(n => n.toLowerCase().includes(searchQuery));
}

function renderTable() {
  const tbody = document.getElementById('tabelGridBody');
  const filtered = getFilteredMurid();

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="2" class="empty-state">
      ${daftarMurid.length === 0 ? 'Belum ada murid di kelas ini.' : 'Tidak ada murid yang cocok.'}
    </td></tr>`;
    updateStats({});
    return;
  }

  let html = '';
  filtered.forEach(nama => {
    const safe = nama.replace(/[^a-zA-Z0-9]/g, '_');
    html += `
      <tr>
        <td class="sticky-col cell-nama">${nama}</td>
        <td class="cell-status belum" id="cell-${safe}">-</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;

  // Load data dari Firebase
  loadAbsensi();
}

function loadAbsensi() {
  if (listenerRef) {
    listenerRef.off();
    listenerRef = null;
  }

  const filtered = getFilteredMurid();
  if (filtered.length === 0) return;

  // Ambil data absensi per murid
  const promises = filtered.map(nama => {
    return db.ref(`kelas/${kelasId}/siswa/${nama}/absen/${tanggalDipilih}`).once('value');
  });

  Promise.all(promises).then(snapshots => {
    const stats = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0, Belum: 0 };

    snapshots.forEach((snap, i) => {
      const nama = filtered[i];
      const safe = nama.replace(/[^a-zA-Z0-9]/g, '_');
      const el = document.getElementById(`cell-${safe}`);
      if (!el) return;

      const data = snap.val();
      const status = data ? data.status : null;

      el.className = 'cell-status';
      if (status === 'Hadir') {
        el.classList.add('hadir');
        el.innerText = 'H';
        stats.Hadir++;
      } else if (status === 'Izin') {
        el.classList.add('izin');
        el.innerText = 'I';
        stats.Izin++;
      } else if (status === 'Sakit') {
        el.classList.add('sakit');
        el.innerText = 'S';
        stats.Sakit++;
      } else if (status === 'Alpa') {
        el.classList.add('alpa');
        el.innerText = 'A';
        stats.Alpa++;
      } else {
        el.classList.add('belum');
        el.innerText = '-';
        stats.Belum++;
      }
    });

    updateStats(stats);
    updateLastUpdate();
  }).catch(err => {
    console.error('Load absensi error:', err);
  });

  // Setup realtime listener
  filtered.forEach(nama => {
    const ref = db.ref(`kelas/${kelasId}/siswa/${nama}/absen/${tanggalDipilih}`);
    ref.on('value', snap => {
      const safe = nama.replace(/[^a-zA-Z0-9]/g, '_');
      const el = document.getElementById(`cell-${safe}`);
      if (!el) return;

      const data = snap.val();
      const status = data ? data.status : null;

      el.className = 'cell-status';
      if (status === 'Hadir') {
        el.classList.add('hadir');
        el.innerText = 'H';
      } else if (status === 'Izin') {
        el.classList.add('izin');
        el.innerText = 'I';
      } else if (status === 'Sakit') {
        el.classList.add('sakit');
        el.innerText = 'S';
      } else if (status === 'Alpa') {
        el.classList.add('alpa');
        el.innerText = 'A';
      } else {
        el.classList.add('belum');
        el.innerText = '-';
      }
      updateStatsFromDOM();
      updateLastUpdate();
    });
    listenerRef = ref;
  });
}

function updateStatsFromDOM() {
  const stats = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0, Belum: 0 };
  document.querySelectorAll('.cell-status').forEach(el => {
    const text = el.innerText;
    if (text === 'H') stats.Hadir++;
    else if (text === 'I') stats.Izin++;
    else if (text === 'S') stats.Sakit++;
    else if (text === 'A') stats.Alpa++;
    else stats.Belum++;
  });
  updateStats(stats);
}

function updateStats(stats) {
  document.getElementById('statHadir').innerText = stats.Hadir || 0;
  document.getElementById('statIzin').innerText = stats.Izin || 0;
  document.getElementById('statSakit').innerText = stats.Sakit || 0;
  document.getElementById('statAlpa').innerText = stats.Alpa || 0;
  document.getElementById('statTotal').innerText = (stats.Hadir || 0) + (stats.Izin || 0) + (stats.Sakit || 0) + (stats.Alpa || 0);
}

function updateLastUpdate() {
  const now = new Date();
  document.getElementById('lastUpdate').innerText = 
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}

function gantiTanggal(date) {
  tanggalDipilih = date;
  renderHeader();
  renderTable();
}

// ===== EXPORT =====
function exportPDF() {
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { showAlert('Error', 'Library PDF belum siap.'); return; }

  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  doc.setFontSize(14);
  doc.setTextColor(37, 99, 235);
  doc.text(`Absensi ${namaKelas}`, 14, 18);
  doc.setFontSize(10);
  doc.setTextColor(100, 116, 139);
  doc.text(formatTanggal(tanggalDipilih), 14, 25);

  const body = [];
  document.querySelectorAll('#tabelGridBody tr').forEach(tr => {
    const tds = tr.querySelectorAll('td');
    if (tds.length === 2) {
      const nama = tds[0].innerText;
      const status = tds[1].innerText;
      let statusText = status === 'H' ? 'Hadir' : status === 'I' ? 'Izin' : status === 'S' ? 'Sakit' : status === 'A' ? 'Alpa' : 'Belum';
      body.push([nama, statusText]);
    }
  });

  doc.autoTable({
    startY: 32,
    head: [['Nama', 'Status']],
    body: body,
    styles: { fontSize: 10, cellPadding: 4 },
    headStyles: { fillColor: [37, 99, 235] },
  });

  doc.save(`Absensi-${namaKelas.replace(/\s+/g,'_')}-${tanggalDipilih}.pdf`);
  showAlert('Berhasil', 'PDF berhasil diunduh.');
}

function exportCSV() {
  let csv = '\uFEFF';
  csv += `Absensi ${namaKelas}\n`;
  csv += `${formatTanggal(tanggalDipilih)}\n\n`;
  csv += 'Nama,Status\n';

  document.querySelectorAll('#tabelGridBody tr').forEach(tr => {
    const tds = tr.querySelectorAll('td');
    if (tds.length === 2) {
      const nama = tds[0].innerText;
      const status = tds[1].innerText;
      let statusText = status === 'H' ? 'Hadir' : status === 'I' ? 'Izin' : status === 'S' ? 'Sakit' : status === 'A' ? 'Alpa' : 'Belum';
      csv += `"${nama}",${statusText}\n`;
    }
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Absensi-${namaKelas.replace(/\s+/g,'_')}-${tanggalDipilih}.csv`;
  link.click();
  showAlert('Berhasil', 'CSV berhasil diunduh.');
}

// ===== INIT =====
window.addEventListener('DOMContentLoaded', function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
  }

  if (!kelasId) {
    showAlert('Error', 'Link tidak valid.');
    return;
  }

  // Set default date
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('pilihTanggal').value = today;
  tanggalDipilih = today;

  db.ref(`kelas/${kelasId}`).once('value').then(snap => {
    if (!snap.exists()) {
      showAlert('Error', 'Kelas tidak ditemukan.');
      return;
    }
    const data = snap.val();
    namaKelas = data.nama || 'Kelas';
    daftarMurid = data.siswa ? Object.keys(data.siswa) : [];

    renderHeader();
    renderTable();
  }).catch(() => {
    showAlert('Error', 'Gagal memuat data kelas.');
  });
});
</script>
