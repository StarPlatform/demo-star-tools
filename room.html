<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Tools | Ruang Tunggu Real-time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }

        header { background: white; border-bottom: 1px solid #e8ecf1; padding: 14px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .navbar { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.1rem; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .logo .icon-box { width: 30px; height: 30px; background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.85rem; }
        
        .main-lobby { max-width: 1000px; width: 100%; margin: 30px auto; padding: 0 20px; flex: 1; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
        .control-panel { background: white; border: 1px solid #e8ecf1; border-radius: 20px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; height: fit-content; }
        .pin-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 16px; padding: 20px; text-align: center; margin: 16px 0; }
        .pin-label { font-size: 0.8rem; text-transform: uppercase; font-weight: 600; color: #64748b; letter-spacing: 0.5px; }
        .pin-number { font-size: 2.5rem; font-weight: 800; color: #4f46e5; margin: 6px 0; letter-spacing: 2px; }
        
        .btn-action { width: 100%; padding: 12px; font-weight: 600; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; font-size: 0.9rem; transition: all 0.2s; }
        .btn-copy { background: #eef2ff; color: #4f46e5; margin-bottom: 12px; }
        .btn-copy:hover { background: #e0e7ff; }
        .btn-start { background: #10b981; color: white; font-size: 1rem; padding: 14px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-start:hover { background: #059669; }
        .btn-start:disabled { background: #cbd5e1; color: #94a3b8; box-shadow: none; cursor: not-allowed; }
        
        .players-panel { background: white; border: 1px solid #e8ecf1; border-radius: 20px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 20px; }
        .panel-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
        .player-count-badge { background: #e0f2fe; color: #0369a1; font-size: 0.85rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
        
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
        .player-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .avatar-box { font-size: 1.8rem; background: white; width: 50px; height: 50px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; }
        .player-name { font-size: 0.9rem; font-weight: 600; color: #334155; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        @media (max-width: 768px) {
            .main-lobby { grid-template-columns: 1fr; }
        }

        /* Baris tombol emoji reaction buat guru */
        .reaction-bar { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .reaction-btn { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 1.15rem; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
        .reaction-btn:hover { background: #eef2ff; border-color: #c7d2fe; transform: translateY(-2px); }
        .reaction-btn:active { transform: scale(0.9); }

        /* Emoji yang terbang naik pas ada siswa (atau guru) kirim reaction */
        .reaction-float-container { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9999; }
        .reaction-bubble { position: absolute; bottom: 40px; text-align: center; animation: floatUp 3s ease-out forwards; }
        .reaction-bubble .emoji-face { font-size: 2rem; display: block; }
        .reaction-bubble .emoji-owner { font-size: 0.7rem; font-weight: 600; color: #4f46e5; background: white; border-radius: 10px; padding: 1px 8px; margin-top: 2px; display: inline-block; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
            15% { opacity: 1; transform: translateY(-20px) translateX(var(--drift, 0px)) scale(1.1); }
            100% { transform: translateY(-380px) translateX(var(--drift, 0px)) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="navbar">
        <div class="logo"><span class="icon-box"><i class="fas fa-star"></i></span> Star Tools <span style="font-weight:400; color:#94a3b8;">| Arena</span></div>
    </div>
</header>

<div class="main-lobby">
    <div class="control-panel">
        <div>
            <h3 style="font-size: 1.1rem; font-weight: 700;">Pengaturan Game</h3>
            <p style="font-size: 0.8rem; color:#64748b; margin-top:4px;">Bagikan sandi PIN kuis di bawah ini ke siswa untuk mulai berkompetisi.</p>
            
            <div class="pin-box">
                <div class="pin-label">PIN Masuk Arena</div>
                <div class="pin-number" id="roomPinText">----</div>
            </div>
            
            <button class="btn-action btn-copy" id="btnCopyPin"><i class="far fa-copy"></i> Salin PIN Kamar</button>

            <div class="reaction-bar" id="reactionBar"></div>
        </div>
        
        <button class="btn-action btn-start" id="btnLaunchBattle" disabled><i class="fas fa-play"></i> Mulai Kompetisi</button>
    </div>

    <div class="players-panel">
        <div class="panel-header">
            <div class="panel-title"><i class="fas fa-users" style="color:#4f46e5; margin-right:6px;"></i>Siswa Terhubung</div>
            <span class="player-count-badge"><span id="playerCounterText">0</span> Player</span>
        </div>
        
        <div class="players-grid" id="playersGrid">
            </div>
    </div>
</div>

<div class="reaction-float-container" id="reactionFloatContainer"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // ==========================================
    // 1. KONFIGURASI DATABASE FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCBVjPohvfPZYs8DfGtzEdi5j4Svb3UvLI",
        authDomain: "class-battle-19f8c.firebaseapp.com",
        databaseURL: "https://class-battle-19f8c-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-battle-19f8c",
        storageBucket: "class-battle-19f8c.firebasestorage.app",
        messagingSenderId: "586414902582",
        appId: "1:586414902582:web:1fb3398c53c8d8e8d0b797"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let roomPin = null;

    // Anti Hacker XSS
    function escapeHtml(str) {
        return str ? str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;') : '';
    }

    // Ikon avatar default berbentuk SVG (pengganti avatar emoji lama)
    const DEFAULT_AVATAR_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L1 8l11 5 9-4.09V17h2V8L12 3z" fill="currentColor"/><path d="M5 10.18v4.32c0 2 3.13 4.5 7 4.5s7-2.5 7-4.5v-4.32l-7 3.18-7-3.18z" fill="currentColor"/></svg>';

    // Avatar yang tersimpan di database berupa markup SVG, jadi harus dianggap HTML tepercaya, bukan teks polos
    function safeAvatarHtml(avatar) {
        return avatar && avatar.trim().startsWith('<svg') ? avatar : DEFAULT_AVATAR_SVG;
    }

    const REACTION_EMOJIS = ['😂', '🔥', '👍', '❤️', '🎉', '😮'];

    // ==========================================
    // EMOJI REACTION: guru juga bisa kirim & lihat reaction dari siswa
    // ==========================================
    function renderReactionBar() {
        const bar = document.getElementById('reactionBar');
        if (!bar) return;
        bar.innerHTML = '';
        REACTION_EMOJIS.forEach((emoji) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'reaction-btn';
            btn.innerText = emoji;
            btn.addEventListener('click', () => sendReaction(emoji));
            bar.appendChild(btn);
        });
    }

    function sendReaction(emoji) {
        if (!roomPin) return;
        const reactionRef = db.ref(`rooms/${roomPin}/reactions`).push();
        reactionRef.set({
            emoji: emoji,
            name: "Guru",
            time: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            setTimeout(() => reactionRef.remove(), 4000);
        });
    }

    function listenReactions() {
        db.ref(`rooms/${roomPin}/reactions`).on('child_added', (snap) => {
            const data = snap.val();
            if (data && data.emoji) spawnReactionBubble(data.emoji, data.name);
        });
    }

    function spawnReactionBubble(emoji, name) {
        const container = document.getElementById('reactionFloatContainer');
        if (!container) return;

        const bubble = document.createElement('div');
        bubble.className = 'reaction-bubble';
        bubble.style.left = `${10 + Math.random() * 80}%`;
        bubble.style.setProperty('--drift', `${(Math.random() * 60) - 30}px`);
        bubble.innerHTML = `
            <span class="emoji-face">${emoji}</span>
            ${name ? `<span class="emoji-owner">${escapeHtml(name)}</span>` : ''}
        `;
        container.appendChild(bubble);
        bubble.addEventListener('animationend', () => bubble.remove());
    }

    // ==========================================
    // 2. OTOMATIS GENERATE ROOM (FIXED NAME)
    // ==========================================
    function createRoomRealtime() {
        const activeQuizId = localStorage.getItem('star_active_quiz_id');
        if (!activeQuizId) {
            alert("Kamu belum buat kuis, bre! Bikin dulu di soal.html");
            window.location.href = "soal.html";
            return;
        }

        // Generate PIN acak 4 digit angka
        roomPin = Math.floor(1000 + Math.random() * 9000).toString();
        
        // Suntik ke elemen teks PIN di HTML lu
        const pinDisplay = document.getElementById('roomPinText') || document.getElementById('displayPin');
        if (pinDisplay) {
            pinDisplay.innerText = roomPin;
        }

        // Buka Room Baru di Firebase Node
        db.ref('rooms/' + roomPin).set({
            quizId: activeQuizId,
            status: "waiting",
            createdAt: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            console.log("Room berhasil dideploy dengan PIN:", roomPin);
            // Mulai dengerin murid masuk secara real-time
            listenPlayersJoin();
            renderReactionBar();
            listenReactions();
        }).catch(err => {
            alert("Gagal setup arena baru: " + err.message);
        });
    }

    // ==========================================
    // 3. STREAM DATA MURID MASUK REALTIME
    // ==========================================
    function listenPlayersJoin() {
        const grid = document.getElementById('playersGrid');
        const countText = document.getElementById('playerCounterText');
        const launchBtn = document.getElementById('btnLaunchBattle');

        // Dengarkan sub-node 'players'
        db.ref(`rooms/${roomPin}/players`).on('value', (snapshot) => {
            if (!snapshot.exists()) {
                if (countText) countText.innerText = "0";
                if (grid) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px 10px;">
                            <i class="fas fa-users-slash" style="font-size: 2.5rem; margin-bottom: 12px; color: #cbd5e1;"></i>
                            <p style="font-size: 0.95rem;">Belum ada murid yang masuk. Bagikan PIN di atas agar mereka bisa bergabung!</p>
                        </div>`;
                }
                if (launchBtn) launchBtn.disabled = true;
                return;
            }

            let currentPlayers = [];
            snapshot.forEach((child) => {
                currentPlayers.push(child.val());
            });

            if (countText) countText.innerText = `${currentPlayers.length}`;
            if (launchBtn) launchBtn.disabled = false;

            if (grid) {
                grid.innerHTML = '';
                currentPlayers.forEach(player => {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <div class="avatar-box">${safeAvatarHtml(player.avatar)}</div>
                        <div class="player-name">${escapeHtml(player.name)}</div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    }

    // Salin PIN ke clipboard. BUG LAMA: navigator.clipboard.writeText() gak ada .catch(),
    // jadi kalau browser blokir izin clipboard (sering kejadian di HP/browser tertentu),
    // tombolnya keliatan gak ngapa-ngapain sama sekali tanpa pesan error apapun.
    function copyRoomPin(pin) {
        function fallbackCopy() {
            const tempInput = document.createElement('textarea');
            tempInput.value = pin;
            tempInput.style.position = 'fixed';
            tempInput.style.opacity = '0';
            document.body.appendChild(tempInput);
            tempInput.focus();
            tempInput.select();
            try {
                const success = document.execCommand('copy');
                if (success) {
                    alert(`PIN Arena [${pin}] berhasil disalin!`);
                } else {
                    alert(`Gagal menyalin otomatis. PIN Arena kamu: ${pin}`);
                }
            } catch (e) {
                alert(`Gagal menyalin otomatis. PIN Arena kamu: ${pin}`);
            }
            document.body.removeChild(tempInput);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pin).then(() => {
                alert(`PIN Arena [${pin}] berhasil disalin!`);
            }).catch(() => {
                fallbackCopy();
            });
        } else {
            fallbackCopy();
        }
    }

    // ==========================================
    // 4. ACTION EVENT HANDLER TOMBOL
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        // FIX UTAMA: Sekarang namanya sudah sama, pasti langsung auto-generate!
        createRoomRealtime();

        // Handler Salin PIN Arena
        const btnCopy = document.getElementById('btnCopyPin');
        if (btnCopy) {
            btnCopy.addEventListener('click', () => {
                if (!roomPin) return;
                copyRoomPin(roomPin);
            });
        }

        // Handler Luncurkan / Mulai Pertandingan
        const btnLaunch = document.getElementById('btnLaunchBattle');
        if (btnLaunch) {
            btnLaunch.addEventListener('click', () => {
                if (!roomPin) return;
                db.ref('rooms/' + roomPin).update({ status: "playing" })
                .then(() => {
                    // BUG LAMA: PIN gak pernah disimpen sebelum pindah halaman,
                    // jadi leaderboard.html gak tau room mana yang mau dipantau
                    localStorage.setItem('star_battle_pin', roomPin);
                    window.location.href = "leaderboard.html";
                }).catch(err => alert("Gagal memulai arena: " + err.message));
            });
        }
    });
</script>

</body>
</html>
