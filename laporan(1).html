<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Laporan Kas - STools</title>

<link rel="icon" type="image/png" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  :root {
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --text: #0F172A;
    --text-soft: #64748B;
    --text-faint: #94A3B8;
    --border: #E2E8F0;
    --primary: #2563EB;
    --primary-soft: #EFF6FF;
    --success: #059669;
    --success-soft: #ECFDF5;
    --danger: #DC2626;
    --danger-soft: #FEF2F2;
    --field-bg: #F8FAFE;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1120;
      --card: #111827;
      --text: #F1F5F9;
      --text-soft: #94A3B8;
      --text-faint: #64748B;
      --border: #1E293B;
      --primary: #60A5FA;
      --primary-soft: #1E3A5F;
      --success: #34D399;
      --success-soft: #0F2A20;
      --danger: #F87171;
      --danger-soft: #3A1414;
      --field-bg: #1E293B;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }

  .halaman {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 12px 28px;
  }

  .kepala {
    padding: 4px 4px 14px;
  }

  .kepala small {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 4px;
  }

  .kepala h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .kepala p {
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--text-soft);
  }

  .kartu {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .ringkasan {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .kotak {
    border-radius: 14px;
    padding: 10px 12px;
    background: var(--field-bg);
  }

  .kotak span {
    display: block;
    font-size: 11.5px;
    color: var(--text-soft);
  }

  .kotak b {
    display: block;
    margin-top: 2px;
    font-size: 15px;
  }

  .kotak.saldo {
    grid-column: 1 / -1;
    background: var(--success-soft);
  }

  .kotak.saldo b {
    font-size: 24px;
    color: var(--success);
  }

  .kotak.masuk b {
    color: var(--primary);
  }

  .kotak.keluar {
    background: var(--danger-soft);
  }

  .kotak.keluar b {
    color: var(--danger);
  }

  .judul-kartu {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .judul-kartu h2 {
    font-size: 15px;
    font-weight: 700;
  }

  .tahun {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .tahun button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--field-bg);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .tahun span {
    min-width: 46px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
  }

  .gulir {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    max-height: 70vh;
  }

  .tbl {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12px;
    text-align: center;
  }

  .tbl th,
  .tbl td {
    height: 30px;
    box-sizing: border-box;
    padding: 0 6px;
    white-space: nowrap;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }

  .tbl tbody tr:last-child td {
    border-bottom: none;
  }

  .tbl .genap {
    background: var(--field-bg);
  }

  .tbl .awal {
    border-left: 1px solid var(--border);
  }

  .tbl thead th {
    position: sticky;
    z-index: 3;
    border-bottom: none;
  }

  .tbl thead tr:first-child th {
    top: 0;
    height: 28px;
    font-weight: 700;
    color: var(--primary);
  }

  .tbl thead tr:first-child th.no,
  .tbl thead tr:first-child th.nama {
    color: var(--text-soft);
    font-size: 11px;
  }

  .tbl thead tr:nth-child(2) th {
    top: 28px;
    height: 22px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border);
  }

  .tbl .no {
    position: sticky;
    left: 0;
    z-index: 2;
    min-width: 30px;
    padding: 0 4px;
    color: var(--text-faint);
  }

  .tbl .nama {
    position: sticky;
    left: 30px;
    z-index: 2;
    min-width: 112px;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
    font-weight: 600;
    box-shadow: 6px 0 8px -6px rgba(15, 23, 42, 0.18);
  }

  .tbl thead .no,
  .tbl thead .nama {
    z-index: 4;
    top: 0;
    border-bottom: 1px solid var(--border);
  }

  .pil {
    display: inline-block;
    min-width: 38px;
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
  }

  .pil.lunas {
    background: #FEF08A;
    color: #854D0E;
  }

  .pil.cicil {
    background: #FED7AA;
    color: #9A3412;
  }

  .legenda {
    display: flex;
    gap: 14px;
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--text-soft);
  }

  .legenda i {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
  }

  .transaksi {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .transaksi:first-of-type {
    border-top: none;
    padding-top: 0;
  }

  .transaksi .info {
    min-width: 0;
  }

  .transaksi .ket {
    font-size: 13px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .transaksi .tgl {
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 1px;
  }

  .transaksi .nilai {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  .transaksi .nilai.masuk {
    color: var(--success);
  }

  .transaksi .nilai.keluar {
    color: var(--danger);
  }

  .lagi {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--field-bg);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .pesan {
    text-align: center;
    color: var(--text-faint);
    font-size: 13.5px;
    padding: 28px 12px;
    line-height: 1.6;
  }

  .pesan b {
    display: block;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 4px;
  }

  .kaki {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    padding: 8px 0 0;
  }

  .sembunyi {
    display: none !important;
  }

  @media (min-width: 900px) {
    .halaman {
      padding-top: 28px;
    }

    .kepala h1 {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

<div class="halaman">
  <div class="kepala">
    <small>Laporan Uang Kas</small>
    <h1 id="namaKelas">Memuat...</h1>
    <p id="infoPembaruan"></p>
  </div>

  <div id="pesanUtama" class="kartu pesan sembunyi"></div>

  <div id="isi" class="sembunyi">
    <div class="kartu">
      <div class="ringkasan">
        <div class="kotak saldo"><span>Saldo kas</span><b id="totalSaldo">Rp 0</b></div>
        <div class="kotak masuk"><span>Total pemasukan</span><b id="totalMasuk">Rp 0</b></div>
        <div class="kotak keluar"><span>Total pengeluaran</span><b id="totalKeluar">Rp 0</b></div>
      </div>
    </div>

    <div class="kartu">
      <div class="judul-kartu">
        <h2>Iuran per Murid</h2>
        <div class="tahun">
          <button type="button" onclick="ubahTahun(-1)" aria-label="Tahun sebelumnya">&#8249;</button>
          <span id="labelTahun"></span>
          <button type="button" onclick="ubahTahun(1)" aria-label="Tahun berikutnya">&#8250;</button>
        </div>
      </div>
      <div id="tabelRekap"></div>
      <div class="legenda">
        <span><i style="background:#FEF08A"></i>Lunas</span>
        <span><i style="background:#FED7AA"></i>Cicil</span>
      </div>
    </div>

    <div class="kartu">
      <div class="judul-kartu"><h2>Transaksi Terbaru</h2></div>
      <div id="daftarTransaksi"></div>
      <button type="button" class="lagi sembunyi" id="tombolLagi" onclick="tampilkanLagi()">Tampilkan lebih banyak</button>
    </div>
  </div>

  <div class="kaki">Star Platform | STools 2026</div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDgr_nHqvpMsiG4lBkYckzxRErkskXj_6E",
  authDomain: "laporanstartools-c18b2.firebaseapp.com",
  databaseURL: "https://laporanstartools-c18b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporanstartools-c18b2"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var DAFTAR_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
var JUMLAH_AWAL = 8;

var kelasId = "";
var tahun = new Date().getFullYear();
var jumlahTampil = JUMLAH_AWAL;

var pengaturan = {};
var daftarSiswa = {};
var dataTahun = {};
var riwayat = [];

var langganan = [];
var langgananTahun = null;
var menunggu = false;

function el(id) {
  return document.getElementById(id);
}

function escapeHtml(teks) {
  return String(teks)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function rupiah(angka) {
  return "Rp " + Number(angka || 0).toLocaleString("id-ID");
}

function tampilkanPesan(judul, isi) {
  el("isi").classList.add("sembunyi");
  var kotak = el("pesanUtama");
  kotak.innerHTML = "<b>" + escapeHtml(judul) + "</b>" + escapeHtml(isi);
  kotak.classList.remove("sembunyi");
}

function tahunDataLama() {
  return Number(pengaturan.tahunData) || new Date().getFullYear();
}

function pathTahun(nilaiTahun) {
  if (Number(nilaiTahun) === tahunDataLama()) return "kas/" + kelasId + "/kas";
  return "kas/" + kelasId + "/kasTahun/" + Number(nilaiTahun);
}

function frekuensiBulan(nilaiTahun, indeksBulan) {
  var kunci = nilaiTahun + "-" + String(indeksBulan + 1).padStart(2, "0");
  var khusus = pengaturan.frekuensiBulan && pengaturan.frekuensiBulan[kunci];
  return Number(khusus) || Number(pengaturan.frekuensi) || 1;
}

function hitungRekap() {
  var kumpulan = {};
  Object.keys(daftarSiswa).forEach(function(nama) {
    kumpulan[nama] = true;
  });
  DAFTAR_BULAN.forEach(function(bulan) {
    Object.keys(dataTahun[bulan] || {}).forEach(function(nama) {
      kumpulan[nama] = true;
    });
  });

  var daftarNama = Object.keys(kumpulan).sort(function(a, b) {
    return a.localeCompare(b, "id");
  });

  var awal = 0;
  if (pengaturan.bulanMulai) {
    var bagian = String(pengaturan.bulanMulai).split("-");
    var tahunMulai = Number(bagian[0]);
    if (tahun === tahunMulai) awal = Number(bagian[1]) - 1;
    else if (tahun < tahunMulai) awal = DAFTAR_BULAN.length;
  }

  var kolom = [];
  DAFTAR_BULAN.forEach(function(bulan, indeks) {
    var adaData = Object.keys(dataTahun[bulan] || {}).length > 0;
    if (indeks < awal && !adaData) return;

    var jumlah = 0;
    daftarNama.forEach(function(nama) {
      var rec = (dataTahun[bulan] || {})[nama];
      if (rec) jumlah = Math.max(jumlah, Number(rec.frekuensi) || 0);
    });
    kolom.push({ bulan: bulan, jumlah: jumlah || frekuensiBulan(tahun, indeks) });
  });

  var nominalDasar = Number(pengaturan.nominal) || 0;

  var baris = daftarNama.map(function(nama) {
    var sel = [];
    kolom.forEach(function(k) {
      var rec = (dataTahun[k.bulan] || {})[nama];
      var nominal = rec ? (Number(rec.nominal) || nominalDasar) : nominalDasar;

      for (var slot = 1; slot <= k.jumlah; slot++) {
        var bayar = rec && rec.bayar ? Number(rec.bayar[slot]) || 0 : 0;
        var status = "";
        if (bayar > 0) status = nominal > 0 && bayar >= nominal ? "lunas" : "cicil";
        sel.push({ bayar: bayar, status: status });
      }
    });
    return { nama: nama, sel: sel };
  });

  return { kolom: kolom, baris: baris };
}

function buatTabel(model) {
  var h = '<div class="gulir"><table class="tbl"><thead><tr>';
  h += '<th rowspan="2" class="no">No</th><th rowspan="2" class="nama">Nama</th>';

  model.kolom.forEach(function(k, i) {
    h += '<th colspan="' + k.jumlah + '" class="awal' + (i % 2 ? ' genap' : '') + '">' + k.bulan + '</th>';
  });
  h += '</tr><tr>';

  model.kolom.forEach(function(k, i) {
    for (var slot = 1; slot <= k.jumlah; slot++) {
      var kelas = [];
      if (slot === 1) kelas.push('awal');
      if (i % 2) kelas.push('genap');
      h += '<th class="' + kelas.join(' ') + '">' + slot + '</th>';
    }
  });
  h += '</tr></thead><tbody>';

  model.baris.forEach(function(b, nomor) {
    h += '<tr><td class="no">' + (nomor + 1) + '</td><td class="nama">' + escapeHtml(b.nama) + '</td>';

    var urutan = 0;
    model.kolom.forEach(function(k, i) {
      for (var slot = 1; slot <= k.jumlah; slot++) {
        var c = b.sel[urutan++];
        var kelas = [];
        if (slot === 1) kelas.push('awal');
        if (i % 2) kelas.push('genap');
        var isi = c.bayar > 0 ? '<span class="pil ' + c.status + '">' + Number(c.bayar).toLocaleString('id-ID') + '</span>' : '';
        h += '<td class="' + kelas.join(' ') + '">' + isi + '</td>';
      }
    });
    h += '</tr>';
  });

  return h + '</tbody></table></div>';
}

function gambarRekap() {
  el("labelTahun").textContent = tahun;
  var model = hitungRekap();

  if (model.baris.length === 0) {
    el("tabelRekap").innerHTML = '<div class="pesan">Belum ada murid yang tercatat.</div>';
    return;
  }
  if (model.kolom.length === 0) {
    el("tabelRekap").innerHTML = '<div class="pesan">Belum ada pencatatan pada tahun ini.</div>';
    return;
  }
  el("tabelRekap").innerHTML = buatTabel(model);
}

function gambarRingkasan() {
  var masuk = 0;
  var keluar = 0;
  riwayat.forEach(function(r) {
    var nominal = Number(r.nominal) || 0;
    if (r.jenis === "masuk") masuk += nominal;
    else keluar += nominal;
  });
  el("totalMasuk").textContent = rupiah(masuk);
  el("totalKeluar").textContent = rupiah(keluar);
  el("totalSaldo").textContent = rupiah(masuk - keluar);
}

function gambarTransaksi() {
  var kotak = el("daftarTransaksi");
  if (riwayat.length === 0) {
    kotak.innerHTML = '<div class="pesan">Belum ada transaksi.</div>';
    el("tombolLagi").classList.add("sembunyi");
    return;
  }

  var tampil = riwayat.slice(0, jumlahTampil);
  kotak.innerHTML = tampil.map(function(r) {
    var masuk = r.jenis === "masuk";
    var judul = r.nama || (masuk ? "Pemasukan" : "Pengeluaran");
    var keterangan = r.keterangan ? judul + " · " + r.keterangan : judul;
    var tanggal = r.waktu ? new Date(r.waktu).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }) : (r.tanggal || "");
    return '<div class="transaksi"><div class="info"><div class="ket">' + escapeHtml(keterangan) + '</div><div class="tgl">' + escapeHtml(tanggal) + '</div></div>' +
      '<div class="nilai ' + (masuk ? 'masuk' : 'keluar') + '">' + (masuk ? '+' : '-') + ' ' + rupiah(r.nominal) + '</div></div>';
  }).join("");

  el("tombolLagi").classList.toggle("sembunyi", riwayat.length <= jumlahTampil);
}

function tampilkanLagi() {
  jumlahTampil += JUMLAH_AWAL;
  gambarTransaksi();
}

function gambarSemua() {
  menunggu = false;
  gambarRingkasan();
  gambarRekap();
  gambarTransaksi();
  el("infoPembaruan").textContent = "Diperbarui " + new Date().toLocaleString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function jadwalkanGambar() {
  if (menunggu) return;
  menunggu = true;
  requestAnimationFrame(gambarSemua);
}

function langgananTahunBaru() {
  if (langgananTahun) langgananTahun.ref.off("value", langgananTahun.fungsi);

  var ref = db.ref(pathTahun(tahun));
  var fungsi = function(snap) {
    dataTahun = snap.val() || {};
    jadwalkanGambar();
  };
  ref.on("value", fungsi);
  langgananTahun = { ref: ref, fungsi: fungsi };
}

function ubahTahun(delta) {
  tahun += delta;
  dataTahun = {};
  el("labelTahun").textContent = tahun;
  langgananTahunBaru();
  jadwalkanGambar();
}

function pasang(ref, fungsi) {
  ref.on("value", fungsi, function() {
    tampilkanPesan("Laporan tidak dapat dimuat", "Akses ke data ditolak atau koneksi bermasalah. Silakan hubungi pengelola kas kelas.");
  });
  langganan.push({ ref: ref, fungsi: fungsi });
}

function mulai() {
  var token = new URLSearchParams(location.search).get("t");
  if (!token || !/^[A-Za-z0-9_-]{8,64}$/.test(token)) {
    el("namaKelas").textContent = "Link tidak valid";
    tampilkanPesan("Link tidak valid", "Periksa kembali link laporan yang Anda terima dari pengelola kas kelas.");
    return;
  }

  db.ref("laporanLink/" + token).once("value").then(function(snap) {
    var id = snap.val();
    if (!id || typeof id !== "string") {
      el("namaKelas").textContent = "Link tidak aktif";
      tampilkanPesan("Link tidak aktif", "Link laporan ini sudah dimatikan atau tidak ditemukan. Mintalah link terbaru kepada pengelola kas kelas.");
      return;
    }

    kelasId = id;

    return db.ref("kelas/" + kelasId + "/nama").once("value").then(function(snapNama) {
      el("namaKelas").textContent = snapNama.val() || "Kelas";
      document.title = "Laporan Kas " + (snapNama.val() || "") + " - STools";

      pasang(db.ref("kas/" + kelasId + "/pengaturan"), function(s) {
        var awal = pengaturan.tahunData;
        pengaturan = s.val() || {};
        if (awal !== undefined && Number(awal) !== Number(pengaturan.tahunData)) langgananTahunBaru();
        jadwalkanGambar();
      });

      return db.ref("kas/" + kelasId + "/pengaturan").once("value");
    }).then(function(snapPengaturan) {
      pengaturan = snapPengaturan.val() || {};

      pasang(db.ref("kas/" + kelasId + "/siswa"), function(s) {
        daftarSiswa = s.val() || {};
        jadwalkanGambar();
      });

      pasang(db.ref("keuangan/" + kelasId + "/riwayat"), function(s) {
        var daftar = [];
        s.forEach(function(anak) {
          daftar.push(anak.val());
        });
        daftar.sort(function(a, b) {
          return (b.waktu || 0) - (a.waktu || 0);
        });
        riwayat = daftar;
        jadwalkanGambar();
      });

      langgananTahunBaru();
      el("pesanUtama").classList.add("sembunyi");
      el("isi").classList.remove("sembunyi");
      jadwalkanGambar();
    });
  }).catch(function() {
    el("namaKelas").textContent = "Laporan Kas";
    tampilkanPesan("Laporan tidak dapat dimuat", "Periksa koneksi internet Anda lalu muat ulang halaman ini.");
  });
}

mulai();
</script>
