<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Nita Chat - Asisten AI</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
:root {
    --bg-main: #ffffff;
    --bg-soft: #f7f7f8;
    --bubble-user: #f4f4f5;
    --accent-pink: #4f46e5;
    --accent-purple: #7c3aed;
    --text-main: #1f2023;
    --text-muted: #6e7075;
    --border-subtle: #e6e6e9;
    --border-strong: #d9d9de;
}
        * { margin:0; padding:0; box-sizing:border-box; min-width:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg-main); color:var(--text-main); display:flex; flex-direction:column; }
        .header-nav { height:58px; background:rgba(255,255,255,0.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-subtle); padding:0 18px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; z-index:10; }
        .header-left { display:flex; align-items:center; gap:8px; min-width:0; }
        .history-btn { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; flex-shrink:0; }
        .history-btn:active { background:var(--bg-soft); }
        .history-btn svg { width:19px; height:19px; }
        .sidebar-overlay { position:fixed; inset:0; background:rgba(20,20,30,0.25); backdrop-filter:blur(2px); z-index:40; display:none; }
        .history-sidebar { position:fixed; top:0; left:0; bottom:0; width:min(310px,86vw); background:#fff; border-right:1px solid var(--border-subtle); box-shadow:12px 0 32px rgba(20,20,30,0.10); z-index:50; transform:translateX(-105%); transition:transform .22s ease; display:flex; flex-direction:column; }
        .history-sidebar.open { transform:translateX(0); }
        .history-sidebar-head { height:58px; padding:0 14px 0 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-subtle); flex-shrink:0; }
        .history-title { font-size:14px; font-weight:700; }
        .history-close { width:34px; height:34px; border:0; background:transparent; border-radius:8px; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .history-sidebar-body { flex:1; overflow-y:auto; padding:12px; }
        .history-new-btn { width:100%; padding:10px 12px; border:1px solid var(--border-subtle); background:#fff; border-radius:10px; font-size:13px; font-weight:600; color:var(--text-main); cursor:pointer; margin-bottom:12px; text-align:left; }
        .session-list { display:flex; flex-direction:column; gap:5px; }
        .session-item { padding:10px 11px; border-radius:9px; font-size:12.5px; cursor:pointer; background:transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .session-item:hover { background:var(--bg-soft); }
        .session-item.active { background:#f0efff; color:#4f46e5; font-weight:600; }
        .session-empty { font-size:11.5px; color:var(--text-muted); padding:8px 10px; }
        .logo { display:flex; align-items:center; gap:9px; }
        .logo-mark { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg, #4f46e5, #7c3aed); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .logo-mark svg { width:17px; height:17px; }
        .logo-text { font-size:15px; font-weight:700; line-height:1.15; }
        .logo-text span { display:block; font-size:10.5px; font-weight:500; color:var(--text-muted); }
        .header-actions { display:flex; align-items:center; gap:4px; position:relative; }
        .menu-btn { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; }
        .menu-btn:active { background:var(--bg-soft); }
        .menu-btn svg { width:19px; height:19px; }
        .dropdown-menu { position:absolute; top:44px; right:0; background:#fff; border:1px solid var(--border-subtle); border-radius:12px; display:none; z-index:100; overflow:hidden; box-shadow:0 12px 28px rgba(20,20,30,0.12); min-width:210px; }
        .dropdown-menu button.menu-action { width:100%; background:transparent; border:none; padding:13px 16px; text-align:left; cursor:pointer; font-size:13.5px; font-weight:500; }
        .dropdown-menu button.menu-action:active { background:var(--bg-soft); }
        .mode-section { padding:12px 16px 10px; }
        .mode-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-muted); margin-bottom:8px; }
        .mode-options { display:flex; gap:6px; }
        .mode-opt { flex:1; padding:7px 0; border-radius:8px; border:1px solid var(--border-subtle); background:var(--bg-soft); font-size:11.5px; font-weight:600; color:var(--text-muted); cursor:pointer; text-align:center; }
        .mode-opt.active { background:linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); color:#fff; border-color:transparent; }
        .session-list { max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
        .session-item { padding:8px 10px; border-radius:8px; font-size:12.5px; cursor:pointer; background:var(--bg-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .session-item.active { background:linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); color:#fff; }
        .session-empty { font-size:11.5px; color:var(--text-muted); padding:6px 10px; }
        .message-feed { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:20px; }
        .welcome-screen { text-align:center; padding:36px 16px; width:100%; max-width:440px; margin:auto; }
        .ai-avatar { width:60px; height:60px; background:linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); border-radius:18px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:0 10px 24px rgba(139,92,246,0.28); }
        .ai-avatar svg { width:28px; height:28px; flex-shrink:0; }
        .welcome-screen h2 { font-size:20px; font-weight:700; margin-bottom:8px; }
        .welcome-screen p { color:var(--text-muted); font-size:12.5px; margin-bottom:18px; line-height:1.55; }
        .suggestion-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
        .suggestion-chip { background:#fff; border:1px solid var(--border-subtle); padding:9px 14px; border-radius:30px; font-size:12px; font-weight:500; cursor:pointer; }
        .suggestion-chip:active { background:var(--bg-soft); transform:scale(0.96); }
        .msg-row { display:flex; gap:10px; max-width:92%; }
        .msg-row.user { align-self:flex-end; justify-content:flex-end; }
        .msg-row.nita { align-self:flex-start; width:92%; }
        .msg-avatar { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
        .msg-avatar svg { width:14px; height:14px; }
        .msg-content { display:flex; flex-direction:column; min-width:0; flex:1; }
        .sender-tag { font-size:11.5px; font-weight:600; margin-bottom:4px; color:var(--text-muted); }
        .msg-row.user .sender-tag { display:none; }
        .bubble-box { font-size:14.5px; line-height:1.6; word-wrap:break-word; }
        .msg-row.user .bubble-box { background:var(--bubble-user); padding:10px 15px; border-radius:18px 18px 4px 18px; }
        .msg-row.nita .bubble-box { padding:0; }
        .bubble-box strong { color:var(--text-main); font-weight:700; }
        .bubble-box code { background:var(--bg-soft); padding:2px 6px; border-radius:4px; font-family:'SFMono-Regular',Consolas,monospace; font-size:13px; color:#7c3aed; }
        .bubble-box pre { background:var(--bg-soft); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; overflow-x:auto; font-family:'SFMono-Regular',Consolas,monospace; font-size:12.5px; color:var(--text-main); margin:6px 0; }
        .loading-row { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); }
        .loading-spinner { width:16px; height:16px; border-radius:50%; border:2px solid rgba(139,92,246,0.2); border-top-color:var(--accent-purple); animation:spin 0.7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .error-card { border:1px solid #fecaca; background:#fff5f5; border-radius:14px; padding:12px 14px; font-size:13px; color:#b91c1c; line-height:1.5; }
        .limit-card { border:1px solid #fde68a; background:#fffbeb; border-radius:14px; padding:12px 14px; font-size:13px; color:#92400e; line-height:1.5; }
        .input-area { position:relative; width:100%; padding:8px 16px 16px; background:linear-gradient(transparent, var(--bg-main) 40%); flex-shrink:0; }
        .input-wrapper { width:100%; display:flex; align-items:center; gap:6px; padding:8px 8px 8px 6px; background:#fff; border:1.5px solid var(--border-strong); border-radius:26px; box-shadow:0 2px 10px rgba(20,20,30,0.05); }
        .input-wrapper:focus-within { border-color:var(--accent-purple); }
        .icon-btn { width:34px; height:34px; border-radius:50%; border:none; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:var(--text-muted); }
        .icon-btn:active { transform:scale(0.9); }
        .icon-btn:disabled { opacity:0.4; }
        .icon-btn svg { width:16px; height:16px; }
        .input-wrapper input { flex:1; width:100%; height:34px; background:transparent; border:none; outline:none; font-size:14px; }
        .input-wrapper input::placeholder { color:#a2a3ac; }
        .input-wrapper input:disabled { color:#c2c3cc; }
        .btn-send { width:34px; height:34px; flex-shrink:0; border-radius:50%; background:linear-gradient(135deg, var(--accent-pink), var(--accent-purple)); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .btn-send:active { transform:scale(0.93); }
        .btn-send:disabled { opacity:0.4; }
        .btn-send svg { width:18px; height:18px; }
        .limit-badge { text-align:center; font-size:11px; color:var(--text-muted); margin-top:7px; }
        .message-feed::-webkit-scrollbar { width:4px; }
        .message-feed::-webkit-scrollbar-track { background:transparent; }
        .message-feed::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:4px; }
        .custom-alert-overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(20,20,30,0.5); backdrop-filter:blur(6px); }
        .custom-alert-box { width:100%; max-width:380px; padding:24px; text-align:center; background:#fff; border:1px solid var(--border-subtle); border-radius:18px; box-shadow:0 20px 45px rgba(0,0,0,0.18); }
        .custom-alert-title { font-size:14.5px; font-weight:700; color:var(--accent-purple); margin-bottom:12px; }
        .custom-alert-msg { font-size:13.5px; line-height:1.5; color:var(--text-muted); margin-bottom:20px; white-space:pre-line; }
        .custom-alert-btn { background:var(--bg-soft); border:1px solid var(--border-subtle); color:var(--text-main); padding:9px 24px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer; }
        .custom-alert-btn:active { transform:scale(0.97); }
        #confirmYesBtn { background:#ef4444 !important; color:#fff !important; border-color:#ef4444 !important; }
        .icon-btn.mic-active { background:#ef4444; color:#fff; }
        .voice-overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:9998; display:none; flex-direction:column; align-items:center; justify-content:center; background:#fff; }
        .voice-orb { width:150px; height:150px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--accent-purple), var(--accent-pink)); box-shadow:0 0 60px rgba(139,92,246,0.5); transition:transform 0.4s ease; }
        .voice-orb-listening { animation:voicePulse 1.6s ease-in-out infinite; }
        .voice-orb-thinking { animation:voiceSpinPulse 1s linear infinite; }
        .voice-orb-speaking { animation:voicePulse 0.5s ease-in-out infinite; }
        @keyframes voicePulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
        @keyframes voiceSpinPulse { 0%{transform:scale(0.94) rotate(0deg);} 50%{transform:scale(1.05) rotate(180deg);} 100%{transform:scale(0.94) rotate(360deg);} }
        .voice-status-text { color:var(--text-main); font-size:15px; font-weight:600; margin-top:28px; }
        .voice-close-btn { position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .voice-close-btn svg { width:18px; height:18px; stroke:var(--text-main); }
        .action-sheet-overlay { position:fixed; inset:0; background:rgba(20,20,30,0.35); z-index:500; display:none; align-items:flex-end; }
        .action-sheet-overlay.open { display:flex; }
        .action-sheet { width:100%; background:#fff; border-radius:18px 18px 0 0; padding:8px 0 max(8px, env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,0.15); }
        .action-sheet-btn { width:100%; background:transparent; border:none; padding:15px 20px; text-align:left; font-size:14.5px; font-weight:500; cursor:pointer; border-bottom:1px solid var(--border-subtle); color:var(--text-main); }
        .action-sheet-btn:last-child { border-bottom:none; }
        .action-sheet-btn:active { background:var(--bg-soft); }
        .toast { position:fixed; bottom:110px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(20,20,30,0.9); color:#fff; padding:9px 18px; border-radius:30px; font-size:12.5px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s ease; z-index:600; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        @keyframes msgPop { 0% { transform:scale(0.85); opacity:0; } 100% { transform:scale(1); opacity:1; } }
        .msg-pop { animation: msgPop 0.22s ease; }
        .scroll-bottom-btn { position:fixed; right:18px; bottom:96px; width:38px; height:38px; border-radius:50%; background:#fff; border:1px solid var(--border-subtle); box-shadow:0 6px 18px rgba(20,20,30,0.15); display:flex; align-items:center; justify-content:center; color:var(--text-main); cursor:pointer; z-index:30; }
        .scroll-bottom-btn svg { width:17px; height:17px; }
        .session-item { display:flex; align-items:center; gap:6px; }
        .session-item-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .session-delete-btn { background:transparent; border:none; color:inherit; opacity:0.5; padding:4px; flex-shrink:0; cursor:pointer; display:flex; }
        .session-delete-btn:active { opacity:1; }
    </style>
</head>
<body>
<div class="header-nav">
    <div class="header-left">
        <div class="history-btn" onclick="toggleHistorySidebar()" title="Riwayat Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
        </div>
        <div class="logo">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                <circle cx="8" cy="11" r="1" fill="white" stroke="none"/><circle cx="12" cy="11" r="1" fill="white" stroke="none"/><circle cx="16" cy="11" r="1" fill="white" stroke="none"/>
            </svg>
        </div>
        <div class="logo-text">Nita Chat<span>Asisten AI</span></div>
        </div>
    </div>
    <div class="header-actions">
        <div class="menu-btn" onclick="startNewChat()" title="Chat Baru">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div class="menu-btn" onclick="toggleMenu()" title="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
        </div>
        <div id="dropdownMenu" class="dropdown-menu">
            <div class="mode-section">
                <div class="mode-label">Karakter Jawaban Nita</div>
                <div class="mode-options">
                    <button class="mode-opt" data-mode="baku" onclick="setNitaMode('baku')">Baku</button>
                    <button class="mode-opt" data-mode="santai" onclick="setNitaMode('santai')">Santai</button>
                    <button class="mode-opt" data-mode="sarkas" onclick="setNitaMode('sarkas')">Sarkas</button>
                </div>
            </div>
            <button class="menu-action" style="color:#dc2626;" onclick="clearAllHistory()">Hapus Semua Pesan</button>
        </div>
    </div>
</div>
<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeHistorySidebar()"></div>
<div id="historySidebar" class="history-sidebar">
    <div class="history-sidebar-head">
        <div class="history-title">Riwayat Chat</div>
        <button class="history-close" onclick="closeHistorySidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="history-sidebar-body">
        <button class="history-new-btn" onclick="startNewChat()">＋ Chat Baru</button>
        <div id="sessionList" class="session-list"></div>
    </div>
</div>
<div class="message-feed" id="chatFeed">
    <div class="welcome-screen" id="welcomeScreen">
        <div class="ai-avatar">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                <circle cx="8" cy="11" r="1" fill="white" stroke="none"/><circle cx="12" cy="11" r="1" fill="white" stroke="none"/><circle cx="16" cy="11" r="1" fill="white" stroke="none"/>
            </svg>
        </div>
        <h2>Nita Chat</h2>
        <p>Asisten AI yang siap bantu jawab soal, ngoding, analisis, atau ngobrol topik apa aja.</p>
        <div class="suggestion-grid">
            <div class="suggestion-chip" onclick="quickAsk('Jelaskan konsep limit dalam kalkulus beserta contohnya')">Soal Matematika</div>
            <div class="suggestion-chip" onclick="quickAsk('Jelaskan hukum Newton 1, 2, 3')">Konsep Fisika</div>
            <div class="suggestion-chip" onclick="quickAsk('Buatkan contoh kode Python untuk sorting array')">Bantu Coding</div>
        </div>
    </div>
</div>
<div class="input-area">
    <div class="input-wrapper">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processCameraImage(this)">
        <button class="icon-btn" onclick="document.getElementById('cameraInput').click()" title="Foto soal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <input type="text" id="messageInput" placeholder="Tanya apa saja ke Nita..." oninput="updateActionButton()" onkeypress="if(event.key==='Enter'){event.preventDefault();sendMessage();}">
        <button class="icon-btn" id="micBtn" onclick="toggleMic()" title="Input suara">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="btn-send" id="sendBtn" onclick="handleActionButton()" title="Ngobrol suara">
            <svg id="sendBtnIcon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12v3a2 2 0 0 0 2 2h1v-7H6a2 2 0 0 0-2 2z"/><path d="M20 12v3a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2z"/><path d="M15 19c-.8.65-1.8 1-3 1h-1"/></svg>
        </button>
    </div>
    <div class="limit-badge" id="limitBadge"></div>
</div>
<div id="customAlertModal" class="custom-alert-overlay">
    <div class="custom-alert-box">
        <div id="customAlertTitle" class="custom-alert-title">INFO</div>
        <div id="customAlertMessage" class="custom-alert-msg">Pesan.</div>
        <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
    </div>
</div>
<div id="customConfirmModal" class="custom-alert-overlay" style="display:none;">
    <div class="custom-alert-box" style="max-width:380px; width:90%;">
        <div class="custom-alert-title">KONFIRMASI</div>
        <div id="customConfirmMessage" class="custom-alert-msg">Apakah Anda yakin?</div>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:8px;">
            <button id="confirmYesBtn" class="custom-alert-btn">Ya</button>
            <button id="confirmNoBtn" class="custom-alert-btn">Tidak</button>
        </div>
    </div>
</div>
<div id="voiceOverlay" class="voice-overlay">
    <div class="voice-close-btn" onclick="closeVoiceMode()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <div id="voiceOrb" class="voice-orb voice-orb-listening"></div>
    <div id="voiceStatusText" class="voice-status-text">Mendengarkan...</div>
</div>
<div id="messageActionSheet" class="action-sheet-overlay" onclick="closeMessageActions()">
    <div class="action-sheet" onclick="event.stopPropagation()">
        <button class="action-sheet-btn" onclick="copyActiveMessage()">📋&nbsp;&nbsp;Salin Teks</button>
        <button class="action-sheet-btn" id="editResendBtn" onclick="editAndResendActiveMessage()" style="display:none;">✏️&nbsp;&nbsp;Edit &amp; Kirim Ulang</button>
        <button class="action-sheet-btn" onclick="shareActiveMessage()">🔗&nbsp;&nbsp;Bagikan</button>
        <button class="action-sheet-btn" style="color:#dc2626;" onclick="closeMessageActions()">Batal</button>
    </div>
</div>
<div id="toast" class="toast"></div>
<button id="scrollBottomBtn" class="scroll-bottom-btn" onclick="scrollToBottom(true)" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
</button>
<script>
const BACKEND_BASE_URL = "https://nita-backend-b52x.vercel.app";

// ============ STORAGE KEYS ============
const MODE_KEY = "nita_chat_mode";
const SESSIONS_KEY = "nita_chat_sessions";
const ACTIVE_ID_KEY = "nita_active_session_id";
const RATE_KEY = "nita_rate_limit";

// ============ RATE LIMIT CONFIG ============
const MAX_MESSAGES = 50;
const WINDOW_MS = 24 * 60 * 60 * 1000; // 24 jam

let isSending = false;
let currentMode = localStorage.getItem(MODE_KEY) || "baku";
let voiceModeActive = false;
let recognizer = null;
let micRecognizer = null;
let sessions = [];
let activeSessionId = null;

const AVATAR_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><circle cx="8" cy="11" r="1" fill="white" stroke="none"/><circle cx="12" cy="11" r="1" fill="white" stroke="none"/><circle cx="16" cy="11" r="1" fill="white" stroke="none"/></svg>`;
function nitaAvatarHtml() { return `<div class="msg-avatar">${AVATAR_SVG}</div>`; }
const WELCOME_HTML = `
    <div class="welcome-screen" id="welcomeScreen">
        <div class="ai-avatar">${AVATAR_SVG}</div>
        <h2>Nita Chat</h2>
        <p>Asisten AI yang siap bantu jawab soal, ngoding, analisis, atau ngobrol topik apa aja.</p>
        <div class="suggestion-grid">
            <div class="suggestion-chip" onclick="quickAsk('Jelaskan konsep limit dalam kalkulus beserta contohnya')">Soal Matematika</div>
            <div class="suggestion-chip" onclick="quickAsk('Jelaskan hukum Newton 1, 2, 3')">Konsep Fisika</div>
            <div class="suggestion-chip" onclick="quickAsk('Buatkan contoh kode Python untuk sorting array')">Bantu Coding</div>
        </div>
    </div>`;

window.onload = function () {
    applyModeUI();
    initSessions();
    updateLimitUI();
    updateActionButton();
};

// ============ SESSIONS (riwayat & new chat) ============
function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function loadSessionsFromStorage() {
    try { return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || []; } catch (e) { return []; }
}
function persistSessions() {
    try {
        let list = sessions;
        if (list.length > 30) list = list.slice(list.length - 30);
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
        localStorage.setItem(ACTIVE_ID_KEY, activeSessionId);
    } catch (e) {}
}
function initSessions() {
    sessions = loadSessionsFromStorage();
    // Setiap kali masuk kembali, tampilkan chat baru. Riwayat lama tetap tersimpan.
    const fresh = createBlankSession();
    sessions.push(fresh);
    activeSessionId = fresh.id;
    persistSessions();
    renderSessionMessages(fresh);
    renderSessionList();
}
function createBlankSession() {
    return { id: generateId(), title: "Chat baru", messages: [], createdAt: Date.now() };
}
function getActiveSession() {
    return sessions.find(s => s.id === activeSessionId);
}
function startNewChat() {
    toggleMenu(false);
    closeHistorySidebar();
    const active = createBlankSession();
    sessions.push(active);
    activeSessionId = active.id;
    persistSessions();
    renderSessionMessages(active);
    renderSessionList();
}
function switchSession(id) {
    const target = sessions.find(s => s.id === id);
    if (!target) return;
    activeSessionId = id;
    persistSessions();
    renderSessionMessages(target);
    renderSessionList();
    toggleMenu(false);
    closeHistorySidebar();
}
function renderSessionMessages(session) {
    const feed = document.getElementById("chatFeed");
    feed.innerHTML = WELCOME_HTML;
    if (session.messages.length > 0) {
        const w = document.getElementById("welcomeScreen");
        if (w) w.style.display = "none";
        session.messages.forEach(m => renderBubble(m.text, m.sender));
    }
}
function renderSessionList() {
    const container = document.getElementById("sessionList");
    if (!container) return;
    const sorted = [...sessions]
        .filter(s => Array.isArray(s.messages) && s.messages.length > 0)
        .sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
    // Kosongkan area ini kalau memang belum ada chat sebelumnya.
    container.innerHTML = sorted.slice(0, 30).map(s => {
        const activeClass = s.id === activeSessionId ? " active" : "";
        return `<div class="session-item${activeClass}">
            <span class="session-item-title" onclick="switchSession('${s.id}')">${escHtml(s.title || "Chat baru")}</span>
            <button class="session-delete-btn" onclick="deleteSession(event, '${s.id}')" title="Hapus chat ini">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>`;
    }).join("");
}
function deleteSession(evt, id) {
    if (evt) evt.stopPropagation();
    customConfirm("Hapus chat ini dari riwayat? Chat lain gak ikut kehapus.", () => {
        sessions = sessions.filter(s => s.id !== id);
        persistSessions();
        renderSessionList();
        if (id === activeSessionId) {
            const fresh = createBlankSession();
            sessions.push(fresh);
            activeSessionId = fresh.id;
            persistSessions();
            renderSessionMessages(fresh);
            renderSessionList();
        }
    });
}
function addMessageToActiveSession(sender, text) {
    const active = getActiveSession();
    if (!active) return;
    active.messages.push({ sender, text, timestamp: Date.now() });
    if (active.messages.length > 200) active.messages = active.messages.slice(-200);
    if (sender === "user" && (active.title === "Chat baru" || !active.title)) {
        active.title = text.length > 32 ? text.slice(0, 32) + "…" : text;
    }
    active.updatedAt = Date.now();
    persistSessions();
    renderSessionList();
}
function getRecentHistoryForContext() {
    const active = getActiveSession();
    if (!active) return [];
    return active.messages.slice(-8).map(c => ({
        role: c.sender === "user" ? "user" : "assistant",
        content: c.text
    }));
}
function clearAllHistory() {
    toggleMenu(false);
    customConfirm("Hapus semua pesan dan riwayat chat Nita? Batas kirim harian kamu tidak akan ikut ter-reset.", () => {
        sessions = [];
        const fresh = createBlankSession();
        sessions.push(fresh);
        activeSessionId = fresh.id;
        persistSessions();
        renderSessionMessages(fresh);
        renderSessionList();
    });
}

// ============ RATE LIMIT (50 pesan / 24 jam, dihitung dari pesan pertama) ============
function getRateState() {
    let s;
    try { s = JSON.parse(localStorage.getItem(RATE_KEY)) || {}; } catch (e) { s = {}; }
    const now = Date.now();
    if (s.windowStart && (now - s.windowStart >= WINDOW_MS)) {
        s = {}; // window sudah lewat 24 jam, reset
    }
    if (typeof s.count !== "number") s.count = 0;
    return s;
}
function saveRateState(s) {
    localStorage.setItem(RATE_KEY, JSON.stringify(s));
}
function getRateInfo() {
    const s = getRateState();
    const remaining = Math.max(0, MAX_MESSAGES - s.count);
    const resetAt = s.windowStart ? s.windowStart + WINDOW_MS : null;
    return { remaining, resetAt, count: s.count };
}
function canSendMessage() {
    return getRateInfo().remaining > 0;
}
function registerSentMessage() {
    const s = getRateState();
    if (!s.windowStart) s.windowStart = Date.now();
    s.count += 1;
    saveRateState(s);
    updateLimitUI();
}
function formatResetTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const dayDiff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const timeStr = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    if (dayDiff <= 0) return `hari ini jam ${timeStr}`;
    if (dayDiff === 1) return `besok jam ${timeStr}`;
    const dateStr = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    return `${dateStr} jam ${timeStr}`;
}
function updateLimitUI() {
    const info = getRateInfo();
    const badge = document.getElementById("limitBadge");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    if (!badge || !inputEl || !sendBtn) return;
    if (info.remaining <= 0) {
        badge.textContent = `Limit ${MAX_MESSAGES} pesan harian abis. Bisa chat lagi ${formatResetTime(info.resetAt)}.`;
        badge.style.color = "#dc2626";
        inputEl.disabled = true;
        inputEl.placeholder = "Limit chat harian abis...";
        sendBtn.disabled = true;
    } else {
        badge.textContent = `${info.remaining}/${MAX_MESSAGES} pesan tersisa hari ini`;
        badge.style.color = "";
        inputEl.disabled = false;
        inputEl.placeholder = "Tanya apa saja ke Nita...";
        sendBtn.disabled = false;
    }
}

function toggleHistorySidebar() {
    const sidebar = document.getElementById("historySidebar");
    const overlay = document.getElementById("sidebarOverlay");
    if (!sidebar || !overlay) return;
    const open = sidebar.classList.toggle("open");
    overlay.style.display = open ? "block" : "none";
}
function closeHistorySidebar() {
    const sidebar = document.getElementById("historySidebar");
    const overlay = document.getElementById("sidebarOverlay");
    if (sidebar) sidebar.classList.remove("open");
    if (overlay) overlay.style.display = "none";
}

// ============ MODE ============
function setNitaMode(mode) {
    currentMode = mode;
    localStorage.setItem(MODE_KEY, mode);
    applyModeUI();
    toggleMenu(false);
}
function applyModeUI() {
    document.querySelectorAll(".mode-opt").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === currentMode);
    });
}

function quickAsk(text) {
    document.getElementById("messageInput").value = text;
    sendMessage();
}

function handleActionButton() {
    const input = document.getElementById("messageInput");
    if (input && input.value.trim()) sendMessage();
    else openVoiceMode();
}
function updateActionButton() {
    const input = document.getElementById("messageInput");
    const btn = document.getElementById("sendBtn");
    const icon = document.getElementById("sendBtnIcon");
    if (!input || !btn || !icon) return;
    const hasText = input.value.trim().length > 0;
    btn.title = hasText ? "Kirim pesan" : "Ngobrol suara";
    icon.setAttribute("fill", hasText ? "white" : "none");
    icon.setAttribute("stroke", hasText ? "none" : "white");
    icon.innerHTML = hasText
        ? '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>'
        : '<path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12v3a2 2 0 0 0 2 2h1v-7H6a2 2 0 0 0-2 2z"/><path d="M20 12v3a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2z"/><path d="M15 19c-.8.65-1.8 1-3 1h-1"/>';
}

// ============ SEND MESSAGE ============
async function sendMessage() {
    if (isSending) return;
    const inputEl = document.getElementById("messageInput");
    const text = inputEl.value.trim();
    if (!text) return;

    if (!canSendMessage()) {
        const info = getRateInfo();
        showCustomAlert(`Limit ${MAX_MESSAGES} pesan harian kamu udah abis. Coba lagi ${formatResetTime(info.resetAt)} ya.`, "Limit Tercapai");
        return;
    }

    const w = document.getElementById("welcomeScreen");
    if (w) w.style.display = "none";

    if (navigator.vibrate) navigator.vibrate(10);
    renderBubble(text, "user", false, true);
    inputEl.value = "";
    updateActionButton();
    addMessageToActiveSession("user", text);
    registerSentMessage();

    return await callNitaBackend(text);
}

async function callNitaBackend(message) {
    isSending = true;
    const typingRow = renderTypingBubble();
    try {
        const body = {
            message,
            mode: currentMode,
            history: getRecentHistoryForContext()
        };
        const resp = await fetch(BACKEND_BASE_URL + "/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        const data = await resp.json();
        removeEl(typingRow);
        if (!resp.ok || !data.reply) {
            renderErrorBubble(data.error || "Nita lagi susah dihubungi.");
            isSending = false;
            return null;
        }
        await renderBubble(data.reply, "nita", true);
        addMessageToActiveSession("nita", data.reply);
        isSending = false;
        return data.reply;
    } catch (err) {
        removeEl(typingRow);
        renderErrorBubble("Koneksi gagal: " + err.message);
        isSending = false;
        return null;
    }
}

function renderBubble(text, sender, animate = false, pop = false) {
    const feed = document.getElementById("chatFeed");
    const row = document.createElement("div");
    row.className = `msg-row ${sender}` + (pop ? " msg-pop" : "");
    if (sender === "user") {
        row.innerHTML = `<div class="msg-content"><div class="bubble-box">${escHtml(text)}</div></div>`;
    } else {
        row.innerHTML = `${nitaAvatarHtml()}<div class="msg-content"><span class="sender-tag">Nita Chat</span><div class="bubble-box"></div></div>`;
    }
    feed.appendChild(row);
    attachLongPress(row.querySelector(".bubble-box"), sender, text);
    scrollToBottom();

    if (sender === "nita" && animate) {
        return typeNitaReply(row.querySelector(".bubble-box"), text).then(() => row);
    }
    if (sender === "nita") row.querySelector(".bubble-box").innerHTML = formatMarkdown(text);
    return row;
}

// ============ TEKAN LAMA BUBBLE: salin / edit & kirim ulang / bagikan ============
let activeMessageRef = null;
function attachLongPress(el, sender, text) {
    let timer = null;
    let moved = false;
    const start = () => {
        moved = false;
        timer = setTimeout(() => { if (!moved) openMessageActions(sender, text); }, 450);
    };
    const cancel = () => clearTimeout(timer);
    const markMoved = () => { moved = true; clearTimeout(timer); };
    el.addEventListener("touchstart", start, { passive: true });
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchmove", markMoved);
    el.addEventListener("mousedown", start);
    el.addEventListener("mouseup", cancel);
    el.addEventListener("mouseleave", cancel);
}
function openMessageActions(sender, text) {
    activeMessageRef = { sender, text };
    document.getElementById("editResendBtn").style.display = sender === "user" ? "block" : "none";
    document.getElementById("messageActionSheet").classList.add("open");
}
function closeMessageActions() {
    document.getElementById("messageActionSheet").classList.remove("open");
}
function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("Teks disalin"); } catch (e) {}
    document.body.removeChild(ta);
}
function copyActiveMessage() {
    if (!activeMessageRef) return;
    const text = activeMessageRef.text;
    closeMessageActions();
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Teks disalin")).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}
function editAndResendActiveMessage() {
    if (!activeMessageRef) return;
    const text = activeMessageRef.text;
    closeMessageActions();
    const inputEl = document.getElementById("messageInput");
    inputEl.value = text;
    updateActionButton();
    inputEl.focus();
    inputEl.setSelectionRange(text.length, text.length);
}
function shareActiveMessage() {
    if (!activeMessageRef) return;
    const text = activeMessageRef.text;
    closeMessageActions();
    if (navigator.share) {
        navigator.share({ text }).catch(() => {});
    } else {
        fallbackCopy(text);
        showToast("Share gak didukung, teks disalin aja");
    }
}
let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
async function typeNitaReply(container, text) {
    const chars = Array.from(text);
    const step = chars.length > 700 ? 6 : chars.length > 350 ? 4 : 2;
    let visible = "";
    for (let i = 0; i < chars.length; i += step) {
        visible += chars.slice(i, i + step).join("");
        container.innerHTML = formatMarkdown(visible);
        scrollToBottom();
        await new Promise(r => setTimeout(r, 7));
    }
    container.innerHTML = formatMarkdown(text);
    scrollToBottom();
}
function renderTypingBubble() {
    const feed = document.getElementById("chatFeed");
    const row = document.createElement("div");
    row.className = "msg-row nita";
    row.innerHTML = `${nitaAvatarHtml()}<div class="msg-content"><span class="sender-tag">Nita Chat</span><div class="bubble-box"><div class="loading-row"><div class="loading-spinner"></div><span>Nita lagi mikir...</span></div></div></div>`;
    feed.appendChild(row);
    scrollToBottom();
    return row;
}
function renderErrorBubble(msg) {
    const feed = document.getElementById("chatFeed");
    const row = document.createElement("div");
    row.className = "msg-row nita";
    row.innerHTML = `${nitaAvatarHtml()}<div class="msg-content"><span class="sender-tag">Nita Chat</span><div class="bubble-box"><div class="error-card">${escHtml(msg)}<br><span style="opacity:0.75;">Cek koneksi internet kamu, atau coba lagi beberapa saat ya.</span></div></div></div>`;
    feed.appendChild(row);
    scrollToBottom();
}
function removeEl(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
function scrollToBottom(smooth) {
    const feed = document.getElementById("chatFeed");
    if (!feed) return;
    if (smooth) feed.scrollTo({ top: feed.scrollHeight, behavior: "smooth" });
    else feed.scrollTop = feed.scrollHeight;
    const btn = document.getElementById("scrollBottomBtn");
    if (btn) btn.style.display = "none";
}
document.addEventListener("DOMContentLoaded", function () {
    const feed = document.getElementById("chatFeed");
    if (!feed) return;
    feed.addEventListener("scroll", function () {
        const btn = document.getElementById("scrollBottomBtn");
        if (!btn) return;
        const distanceFromBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight;
        btn.style.display = distanceFromBottom > 120 ? "flex" : "none";
    });
});

function formatMarkdown(text) {
    let t = escHtml(text);
    t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, "<pre><code>$2</code></pre>");
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/\*(.+?)\*/g, "<em>$1</em>");
    t = t.replace(/^### (.+)$/gm, '<div style="font-size:14px;font-weight:700;margin:8px 0 4px;">$1</div>');
    t = t.replace(/^## (.+)$/gm, '<div style="font-size:15px;font-weight:700;margin:8px 0 4px;">$1</div>');
    t = t.replace(/^# (.+)$/gm, '<div style="font-size:16px;font-weight:700;margin:8px 0 4px;">$1</div>');
    t = t.replace(/^\s*[-•]\s+(.+)$/gm, '<div style="display:flex;gap:6px;margin:2px 0;"><span style="color:var(--accent-purple);flex-shrink:0;">&bull;</span><span>$1</span></div>');
    t = t.replace(/^\s*(\d+)\.\s+(.+)$/gm, '<div style="display:flex;gap:6px;margin:2px 0;"><span style="color:var(--accent-purple);font-weight:600;flex-shrink:0;">$1.</span><span>$2</span></div>');
    t = t.replace(/\n\n/g, "<br><br>");
    t = t.replace(/\n/g, "<br>");
    return t;
}
function escHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

async function processCameraImage(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const w = document.getElementById("welcomeScreen");
    if (w) w.style.display = "none";
    const typingRow = renderTypingBubble();
    const label = typingRow.querySelector(".loading-row span");
    if (label) label.textContent = "Nita lagi baca gambarnya...";
    try {
        const result = await Tesseract.recognize(file, "ind+eng");
        removeEl(typingRow);
        const scannedText = result.data.text.trim();
        if (scannedText.length < 3) {
            showCustomAlert("Teks di foto kurang jelas. Coba foto ulang dengan pencahayaan yang lebih terang ya.", "Gagal Membaca");
            return;
        }
        document.getElementById("messageInput").value = scannedText;
        updateActionButton();
        renderErrorBubbleNeutral("Ini hasil baca fotonya, cek dulu sebelum dikirim ya (OCR kadang meleset):\n" + scannedText);
        document.getElementById("messageInput").focus();
    } catch (error) {
        removeEl(typingRow);
        showCustomAlert("Gagal memproses gambar: " + error.message, "Error");
    }
    input.value = "";
}
function renderErrorBubbleNeutral(msg) {
    const feed = document.getElementById("chatFeed");
    const row = document.createElement("div");
    row.className = "msg-row nita";
    row.innerHTML = `${nitaAvatarHtml()}<div class="msg-content"><span class="sender-tag">Nita Chat</span><div class="bubble-box">${formatMarkdown(msg)}</div></div>`;
    feed.appendChild(row);
    scrollToBottom();
}

function getSpeechRecognitionCtor() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function toggleMic() {
    const Ctor = getSpeechRecognitionCtor();
    if (!Ctor) {
        showCustomAlert("Perangkat/browser kamu belum mendukung input suara.", "Tidak Didukung");
        return;
    }
    const micBtn = document.getElementById("micBtn");
    if (micRecognizer) {
        micRecognizer.stop();
        return;
    }
    micRecognizer = new Ctor();
    micRecognizer.lang = "id-ID";
    micRecognizer.interimResults = false;
    micRecognizer.maxAlternatives = 1;
    micBtn.classList.add("mic-active");
    micRecognizer.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        const inputEl = document.getElementById("messageInput");
        inputEl.value = transcript;
        updateActionButton();
        inputEl.focus();
    };
    micRecognizer.onerror = function () {
        micBtn.classList.remove("mic-active");
        micRecognizer = null;
    };
    micRecognizer.onend = function () {
        micBtn.classList.remove("mic-active");
        micRecognizer = null;
    };
    micRecognizer.start();
}

function openVoiceMode() {
    if (!canSendMessage()) {
        const info = getRateInfo();
        showCustomAlert(`Limit ${MAX_MESSAGES} pesan harian kamu udah abis. Coba lagi ${formatResetTime(info.resetAt)} ya.`, "Limit Tercapai");
        return;
    }
    const Ctor = getSpeechRecognitionCtor();
    if (!Ctor || !window.speechSynthesis) {
        showCustomAlert("Perangkat/browser kamu belum mendukung mode suara.", "Tidak Didukung");
        return;
    }
    voiceModeActive = true;
    document.getElementById("voiceOverlay").style.display = "flex";
    setVoiceStatus("Mendengarkan...", "listening");
    startVoiceListening();
}

function closeVoiceMode() {
    voiceModeActive = false;
    document.getElementById("voiceOverlay").style.display = "none";
    if (recognizer) {
        try { recognizer.onend = null; recognizer.stop(); } catch (e) {}
        recognizer = null;
    }
    window.speechSynthesis.cancel();
}

function setVoiceStatus(text, state) {
    document.getElementById("voiceStatusText").textContent = text;
    const orb = document.getElementById("voiceOrb");
    orb.className = "voice-orb voice-orb-" + state;
}

function startVoiceListening() {
    if (!voiceModeActive) return;
    if (!canSendMessage()) {
        closeVoiceMode();
        const info = getRateInfo();
        showCustomAlert(`Limit ${MAX_MESSAGES} pesan harian kamu udah abis. Coba lagi ${formatResetTime(info.resetAt)} ya.`, "Limit Tercapai");
        return;
    }
    const Ctor = getSpeechRecognitionCtor();
    recognizer = new Ctor();
    recognizer.lang = "id-ID";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    setVoiceStatus("Mendengarkan...", "listening");
    recognizer.onresult = async function (event) {
        const transcript = event.results[0][0].transcript;
        if (!transcript || !transcript.trim()) return;
        if (!canSendMessage()) {
            closeVoiceMode();
            const info = getRateInfo();
            showCustomAlert(`Limit ${MAX_MESSAGES} pesan harian kamu udah abis. Coba lagi ${formatResetTime(info.resetAt)} ya.`, "Limit Tercapai");
            return;
        }
        setVoiceStatus("Nita lagi mikir...", "thinking");
        const w = document.getElementById("welcomeScreen");
        if (w) w.style.display = "none";
        renderBubble(transcript, "user");
        addMessageToActiveSession("user", transcript);
        registerSentMessage();
        const reply = await callNitaBackend(transcript);
        if (reply && voiceModeActive) {
            speakReply(reply);
        } else if (voiceModeActive) {
            startVoiceListening();
        }
    };
    recognizer.onerror = function () {
        if (voiceModeActive) startVoiceListening();
    };
    recognizer.onend = function () {};
    recognizer.start();
}

let cachedVoices = [];
function loadVoices() {
    cachedVoices = window.speechSynthesis.getVoices();
}
if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickBestIndonesianVoice() {
    if (!cachedVoices.length) cachedVoices = window.speechSynthesis.getVoices();
    const idVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("id"));
    if (idVoices.length === 0) return null;
    // Prioritaskan voice non-Google (biasanya suara bawaan OS lebih natural),
    // fallback ke voice id-ID apapun yang ada kalau cuma itu satu-satunya.
    const nonGoogle = idVoices.find(v => !/google/i.test(v.name));
    return nonGoogle || idVoices[0];
}
function speakReply(text) {
    setVoiceStatus("Nita ngomong...", "speaking");
    const plain = text.replace(/[*`_#]/g, "");
    const utterance = new SpeechSynthesisUtterance(plain);
    utterance.lang = "id-ID";
    const voice = pickBestIndonesianVoice();
    if (voice) utterance.voice = voice;
    utterance.pitch = 1.05;
    utterance.rate = 1.03;
    utterance.onend = function () {
        if (voiceModeActive) startVoiceListening();
    };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
}

function showCustomAlert(message, title) {
    document.getElementById("customAlertTitle").textContent = title || "INFO";
    document.getElementById("customAlertMessage").textContent = message;
    document.getElementById("customAlertModal").style.display = "flex";
}
function closeCustomAlert() { document.getElementById("customAlertModal").style.display = "none"; }
function customConfirm(message, onYes) {
    const modal = document.getElementById("customConfirmModal");
    document.getElementById("customConfirmMessage").textContent = message;
    modal.style.display = "flex";
    const handleYes = () => { modal.style.display = "none"; onYes(); cleanup(); };
    const handleNo = () => { modal.style.display = "none"; cleanup(); };
    const cleanup = () => {
        document.getElementById("confirmYesBtn").removeEventListener("click", handleYes);
        document.getElementById("confirmNoBtn").removeEventListener("click", handleNo);
    };
    document.getElementById("confirmYesBtn").addEventListener("click", handleYes);
    document.getElementById("confirmNoBtn").addEventListener("click", handleNo);
}
function toggleMenu(force) {
    const menu = document.getElementById("dropdownMenu");
    if (typeof force === "boolean") {
        menu.style.display = force ? "block" : "none";
        return;
    }
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}
document.addEventListener("click", function (e) {
    const menu = document.getElementById("dropdownMenu");
    const btns = document.querySelectorAll(".menu-btn");
    let insideBtn = false;
    btns.forEach(b => { if (b.contains(e.target)) insideBtn = true; });
    if (menu && !menu.contains(e.target) && !insideBtn) menu.style.display = "none";
});

</script>
